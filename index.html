<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title></title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
body{margin:0;background:#F8FAF9;color:#1E3340;font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;font-size:17px;line-height:1.75;word-break:keep-all}
main{max-width:640px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:1.7rem;line-height:1.3;border-left:6px solid #2F7466;padding-left:14px;margin:0 0 24px}
h2{font-size:1.2rem;margin:32px 0 10px;padding-bottom:6px;border-bottom:2px solid #D6E0DC}
img{max-width:100%;border-radius:8px}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
th,td{border:1px solid #D6E0DC;padding:8px 10px}th{background:#E3EFEB}
blockquote{margin:16px 0;background:#FBF0DF;border-left:5px solid #B8741F;padding:10px 16px;border-radius:0 8px 8px 0}
blockquote p{margin:0}
li input[type=checkbox]{width:20px;height:20px;accent-color:#2F7466;vertical-align:middle;margin-right:6px}
.empty{color:#5E7079;text-align:center;margin-top:30vh}
</style></head><body><main id="c"></main>
<script>
const c=document.getElementById('c');
const id=new URLSearchParams(location.search).get('p');
if(!id){c.innerHTML='<p class="empty">QR 코드로 접속해 주세요.</p>'}
else fetch('pages/'+encodeURIComponent(id)+'.md?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.text()})
.then(t=>{
  c.innerHTML=marked.parse(t);
  const h=c.querySelector('h1'); document.title=h?h.textContent:id;
  c.querySelectorAll('li input[type=checkbox]').forEach(i=>i.disabled=false);
}).catch(()=>{c.innerHTML='<p class="empty">페이지를 찾을 수 없어요.</p>'});
</script></body></html>
