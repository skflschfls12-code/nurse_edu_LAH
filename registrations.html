<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>진료 가능 등록 관리 방법</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css");
*{box-sizing:border-box}
body{margin:0;background:#F6F4EF;color:#20242B;font-family:Pretendard,sans-serif;font-size:15.5px;line-height:1.68;letter-spacing:-.015em;word-break:keep-all}
main{max-width:600px;margin:0 auto;padding:22px 14px 70px}
h1{font-size:1.45rem;font-weight:800;letter-spacing:-.035em;margin:0 0 18px;padding:20px 16px;line-height:1.35;text-align:center;background:#fff;border:2px solid #20242B;border-radius:14px;box-shadow:4px 4px 0 #20242B}
h2{font-size:.9rem;font-weight:800;margin:28px 2px 10px;background:#20242B;color:#fff;display:inline-block;padding:5px 13px;border-radius:20px}
.card{background:#fff;border:2px solid #20242B;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:3px 3px 0 rgba(32,36,43,.18)}
.head{display:flex;gap:10px;align-items:center;margin-bottom:8px;padding-bottom:9px;border-bottom:2px dashed #E0DCD2}
.head h3{margin:0;font-size:1rem;font-weight:700;line-height:1.45;letter-spacing:-.02em;flex:1}
.num{background:var(--c);color:#fff;font-weight:800;font-size:.85rem;width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none}
figure img{border-radius:8px}
figcaption{font-size:.82rem;color:#6E6A61;margin-top:7px;text-align:center}
.txt{margin-top:11px;font-size:.93rem;line-height:1.65}
.note{background:#FFF9E3;border:1.5px solid #E8D98A;border-radius:10px;padding:11px 13px;margin-top:12px;font-size:.9rem;line-height:1.62}
.note::before{content:"💡 ";}
.warn{background:#FFEFEF;border:1.5px solid #EDBCBC;border-radius:10px;padding:11px 13px;margin-top:12px;font-size:.9rem;line-height:1.62}
.warn::before{content:"⚠️ ";}
.note p,.warn p{margin:0;display:inline}
mark{background:#FFE072;padding:0 3px;border-radius:3px}
.hs{margin:14px 0 0}
.hswrap{position:relative;display:block;line-height:0}
.hswrap img{width:100%;border-radius:8px;cursor:default}
.dot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#20242B;color:#fff;font:inherit;font-size:.82rem;font-weight:800;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4);padding:0}
.dot.on{background:#D2691E;transform:translate(-50%,-50%) scale(1.15)}
.hsinfo{background:#F4F2ED;border:1.5px solid #E0DCD2;border-radius:10px;padding:11px 13px;margin-top:10px;font-size:.9rem;line-height:1.6;text-align:left;color:#4A4E56}
.hsinfo .nm{font-weight:700;color:#20242B;display:block;font-size:.97rem;margin-bottom:2px}
.lnk{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid #20242B;color:#20242B;text-decoration:none;padding:15px 17px;border-radius:12px;margin:10px 0 0;font-weight:700;font-size:.97rem;box-shadow:3px 3px 0 rgba(32,36,43,.18)}
.lnk::after{content:"→"}

figure{margin:14px 0 0}figure img{max-width:100%;display:block;margin:0 auto;cursor:zoom-in}
figure video{width:100%;background:#000}
.embed{position:relative;padding-top:56.25%;margin:14px 0 0}.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
#zoom{position:fixed;inset:0;background:rgba(8,14,20,.95);display:none;overflow:auto;z-index:9;padding:56px 10px 20px;text-align:center}
#zoom img{max-width:none;width:auto;border-radius:0}
#zoom .x{position:fixed;top:12px;right:14px;background:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600}
b{font-weight:700}
</style></head><body><main id="c"></main><div id="zoom"><button class="x" type="button">닫기</button><div id="zi"></div></div>

<script>
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/\n/g,'<br>')}
function renderPage(d){
  let h='<h1>'+esc(d.title)+'</h1>',open=false;
  const close=()=>{if(open){h+='</section>';open=false}};
  (d.blocks||[]).forEach(b=>{
    if(b.type==='heading'){close();h+='<h2>'+esc(b.text)+'</h2>'}
    else if(b.type==='card'){close();h+='<section class="card" style="--c:'+esc(b.color||'#2F7466')+'"><div class="head">'+(b.num?'<span class="num">'+esc(b.num)+'</span>':'')+'<h3>'+esc(b.text)+'</h3></div>';open=true}
    else if(b.type==='text'){h+='<div class="txt">'+fmt(b.text)+'</div>'}
    else if(b.type==='note'){h+='<div class="note">'+fmt(b.text)+'</div>'}
    else if(b.type==='warn'){h+='<div class="warn">'+fmt(b.text)+'</div>'}
    else if(b.type==='hotspot'&&b.src){
      h+='<figure class="hs"><div class="hswrap"><img src="'+b.src+'" alt="">';
      (b.points||[]).forEach((p,i)=>{h+='<button class="dot" type="button" data-n="'+esc(p.name)+'" data-d="'+esc(p.desc)+'" style="left:'+p.x+'%;top:'+p.y+'%">'+(i+1)+'</button>'});
      h+='</div><div class="hsinfo">번호를 눌러보세요.</div></figure>'}
    else if(b.type==='link'&&b.file){h+='<a class="lnk" href="'+encodeURIComponent(b.file)+'.html">'+esc(b.text||b.file)+'</a>'}
    else if(b.type==='video'&&b.yt){h+='<div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/'+esc(b.yt)+'" allowfullscreen loading="lazy"></iframe></div>'+(b.caption?'<p class="txt" style="text-align:center;font-size:.85rem;color:#5E7079">'+esc(b.caption)+'</p>':'')}
    else if(b.type==='video'&&b.file){h+='<figure><video controls playsinline preload="metadata" src="'+encodeURI(b.file)+'"></video>'+(b.caption?'<figcaption>'+esc(b.caption)+'</figcaption>':'')+'</figure>'}
    else if(b.type==='image'&&b.src){h+='<figure><img src="'+b.src+'" alt="">'+(b.caption?'<figcaption>'+esc(b.caption)+'</figcaption>':'')+'</figure>'}
  });
  close();return h;
}
const Z=document.getElementById('zoom');
document.addEventListener('click',e=>{
  const dot=e.target.closest&&e.target.closest('.dot');
  if(dot){const f=dot.closest('.hs');f.querySelectorAll('.dot').forEach(x=>x.classList.remove('on'));dot.classList.add('on');
    const n=dot.getAttribute('data-n')||'',d=dot.getAttribute('data-d')||'';
    f.querySelector('.hsinfo').innerHTML=(n?'<span class="nm">'+n+'</span>':'')+d.replace(/\n/g,'<br>');return}
  if(e.target.tagName==='IMG'&&e.target.closest('figure')&&!e.target.closest('.hs')){document.getElementById('zi').innerHTML='<img src="'+e.target.src+'">';Z.style.display='block'}
  if(e.target.classList.contains('x')||e.target.id==='zoom'){Z.style.display='none'}
});
document.getElementById('c').innerHTML=renderPage(JSON.parse(document.getElementById('pagedata').textContent));
</script></body></html>
