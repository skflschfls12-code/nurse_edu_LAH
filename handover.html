<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>응급실 인계정리</title>
<script>try{var _t=localStorage.getItem('er-handover-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#F3F4F6;--panel:#fff;--ink:#1F2937;--sub:#6B7280;--faint:#9CA3AF;--line:#E5E7EB;--line2:#D1D5DB;
  --head:#1E3A5F;--accent:#2563EB;--accentbg:#EFF6FF;--star:#D97706;--starbg:#FFFBEB;
  --headink:#fff;--sbg:rgba(255,255,255,.14);--sph:rgba(255,255,255,.6);--field:#fff;--th:#F9FAFB;--hover:#FAFAFA;--donebg:#FCFCFD;--numc:#1E3A5F;--radius:10px;--pborder:1px solid var(--line);--shadow:none;--hfont:inherit;
  --ok:#059669;--okbg:#ECFDF5;--red:#DC2626;--redbg:#FEF2F2;--hl:#FEF08A
}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.5;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}

/* 상단 */
header{background:var(--head);color:var(--headink)}
header .wrap{display:flex;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
header h1{font-family:var(--hfont);margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
header .date{font-size:13px;opacity:.75}
.search{margin-left:auto;position:relative;flex:0 1 340px;min-width:200px}
.search input{width:100%;border:0;border-radius:8px;padding:9px 34px 9px 34px;background:var(--sbg);color:var(--headink);outline:none}
.search input::placeholder{color:var(--sph)}
.search input:focus{background:var(--field);color:var(--ink)}
.search input:focus::placeholder{color:var(--faint)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.7;pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--faint);font-size:16px;display:none;padding:2px 6px}
.search.has .clr{display:block}
.sinfo{background:var(--hl);color:var(--ink);font-size:13px;padding:6px 20px;text-align:center;display:none}
.sinfo.on{display:block}

/* 패널 */
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-top:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:var(--pborder);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden}
.grid .panel{margin-top:0}
.ph{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.01em}
.ph .n{font-size:12px;color:var(--sub);background:var(--bg);border-radius:10px;padding:1px 8px}
.ph .n:empty{display:none}
.ph .n.red{background:var(--redbg);color:var(--red);font-weight:700}
.ph .sp{flex:1}
.ph .hint{font-size:12px;color:var(--faint)}
.btn{border:1px solid var(--line2);background:var(--field);border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#1D4ED8}
.ico{border:0;background:none;cursor:pointer;color:var(--faint);padding:3px 5px;border-radius:5px;font-size:14px;line-height:1}
.ico:hover{background:var(--bg);color:var(--ink)}
.ico.del:hover{color:var(--red);background:var(--redbg)}

/* 입력칸 공통: 평소엔 글자처럼, 클릭하면 입력칸 */
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:5px 7px;resize:none;overflow:hidden;display:block;min-height:31px}
.cell:hover{border-color:var(--line)}
.cell:focus{outline:none;border-color:var(--accent);background:var(--field);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.cell::placeholder{color:#C4C8CF}
/* 빈 칸 안내 글자는 마우스를 올렸을 때만 */
.tbl tr:not(:hover) .cell:not(:focus)::placeholder{color:transparent}
.cell.date{text-align:center;font-variant-numeric:tabular-nums;padding-left:2px;padding-right:2px}

/* KEEP MEMO */
.keep{list-style:none;margin:0;padding:6px 8px}
.keep li{display:flex;align-items:flex-start;gap:2px;border-radius:7px;padding:1px 2px}
.keep li:hover{background:var(--hover)}
.keep li.star{background:var(--starbg)}
.keep li .cell{flex:1}
.keep li.star .cell{font-weight:700}
.starbtn{border:0;background:none;cursor:pointer;font-size:15px;color:var(--staroff,#D1D5DB);padding:5px 4px;line-height:1.2}
.starbtn.on{color:var(--star)}
.rowtools{display:flex;opacity:0;transition:opacity .12s;padding-top:3px}
li:hover .rowtools,tr:hover .rowtools,li:focus-within .rowtools,tr:focus-within .rowtools{opacity:1}
.addline{display:block;width:100%;text-align:left;border:0;background:none;color:var(--faint);padding:8px 16px 10px;cursor:pointer;font-size:13px}
.addline:hover{color:var(--accent)}

/* 연락처 */
.contacts{width:100%;border-collapse:collapse}
.contacts td{padding:1px 2px;vertical-align:top}
.contacts td:first-child{padding-left:8px;width:42%}
.contacts .num .cell{font-variant-numeric:tabular-nums;font-weight:700;color:var(--numc)}

/* 표 */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{font-size:12px;font-weight:700;color:var(--sub);text-align:left;padding:7px 9px;background:var(--th);border-bottom:1px solid var(--line)}
.tbl th.c{text-align:center}
.tbl td{border-bottom:1px solid var(--line);padding:3px 3px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .grp td{background:var(--th);font-size:12px;color:var(--sub);font-weight:700;padding:6px 12px;cursor:pointer;user-select:none}
.tbl .grp td:hover{color:var(--ink)}
.chk{display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:1px}
.chk input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer;margin:0}
.chk small{font-size:11px;color:var(--ok);font-weight:700;font-variant-numeric:tabular-nums}
tr.done .cell.txt{color:var(--faint);text-decoration:line-through;text-decoration-color:#C4C8CF}
tr.done .cell.date{color:var(--faint)}
tr.done{background:var(--donebg)}
tr.old .cell.date{color:var(--red);font-weight:700}
tr.st{background:var(--starbg)}
tr.st .cell.txt{font-weight:700}
.kind{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:5px 2px;cursor:pointer;font-size:13px;font-weight:700}
.kind:hover{border-color:var(--line)}
.kind.k-수리{color:#B45309}.kind.k-전산{color:#1D4ED8}.kind.k-기타{color:var(--sub)}
.empty td{color:var(--faint);text-align:center;padding:18px!important;font-size:13px}
.hide{display:none!important}
mark{background:var(--hl);color:inherit;border-radius:2px}

/* 하단 */
.foot{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--sub)}
.foot .sp{flex:1}
.banner{margin-top:14px;background:var(--redbg);border:1px solid #FECACA;color:#991B1B;border-radius:8px;padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.banner.info{background:var(--accentbg);border-color:#BFDBFE;color:#1E40AF}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:#111827;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.18s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}


/* ===== 디자인 테마 ===== */
select option{background:var(--panel);color:var(--ink)}
.ph h2{font-family:var(--hfont)}
.themes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.themes span{font-size:12px;color:var(--sub);margin-right:2px}
.th{display:flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--field);color:var(--ink);border-radius:20px;padding:3px 10px 3px 4px;font-size:12px;cursor:pointer}
.th i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}
.th.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;font-weight:700}

/* 서류형: 종이 양식 느낌, 검은 선 */
[data-theme=doc]{--bg:#fff;--panel:#fff;--ink:#111;--sub:#444;--faint:#999;--line:#222;--line2:#222;--head:#fff;--headink:#111;
  --sbg:#fff;--sph:#999;--th:#fff;--hover:#FAFAFA;--donebg:#fff;--numc:#111;--accent:#111;--accentbg:#F5F5F5;--starbg:#FFF8DC;--star:#B8860B;
  --radius:0;--pborder:1.5px solid #222;--hfont:"Batang","바탕","Nanum Myeongjo",serif}
[data-theme=doc] header .wrap{justify-content:center;padding-top:26px;padding-bottom:8px}
[data-theme=doc] header h1{border:1.5px solid #222;padding:16px 70px;font-size:26px;font-weight:400;letter-spacing:.15em;flex:1;text-align:center;max-width:none}
[data-theme=doc] header .date{order:3;flex-basis:100%;text-align:center;opacity:1;color:#444}
[data-theme=doc] .search{order:4;margin:4px auto 0;flex:0 1 460px}
[data-theme=doc] .search input{border:1.5px solid #222;border-radius:0}
[data-theme=doc] .ph{justify-content:center;border-bottom:1.5px solid #222;background:#fff}
[data-theme=doc] .ph h2{font-weight:400;letter-spacing:.08em;font-size:15px}
[data-theme=doc] .ph .sp{display:none}
[data-theme=doc] .ph .btn{position:absolute;right:10px}
[data-theme=doc] .ph .hint{display:none}
[data-theme=doc] .panel .ph{position:relative}
[data-theme=doc] .tbl th,[data-theme=doc] .tbl td{border:1px solid #222}
[data-theme=doc] .tbl th{text-align:center;color:#111;font-weight:400;font-size:13px}
[data-theme=doc] .tbl tr:first-child th{border-top:0}
[data-theme=doc] .tbl th:first-child,[data-theme=doc] .tbl td:first-child{border-left:0}
[data-theme=doc] .tbl th:last-child,[data-theme=doc] .tbl td:last-child{border-right:0}
[data-theme=doc] .btn,[data-theme=doc] .th{border-radius:0}
[data-theme=doc] .btn.pri{background:#111;border-color:#111}
[data-theme=doc] .ph .n{background:none;border:1px solid #222;border-radius:0}
[data-theme=doc] .ph .n.red{background:#111;color:#fff}
[data-theme=doc] .keep li{border-bottom:1px solid #E5E5E5;border-radius:0}

/* 노트: 따뜻한 종이색, 줄 노트 */
[data-theme=note]{--bg:#EFE6D6;--panel:#FFFCF4;--ink:#3B2F24;--sub:#8A7660;--faint:#B5A48C;--line:#E8DDC9;--line2:#D9CBB2;--head:transparent;--headink:#3B2F24;
  --sbg:rgba(255,252,244,.8);--sph:#B5A48C;--field:#FFFCF4;--th:#F7EFDF;--hover:#FBF5E8;--donebg:#FBF7EE;--numc:#B4532A;--accent:#B4532A;--accentbg:#FBEDE4;
  --starbg:#FFF1C9;--star:#D08A12;--radius:4px;--pborder:1px solid #E2D5BE;--shadow:3px 4px 0 rgba(120,90,50,.13);--hfont:"Batang","바탕","Nanum Myeongjo",serif}
[data-theme=note] header .wrap{padding:26px 0 6px;width:calc(100% - 40px);max-width:1140px;border-bottom:2px solid #3B2F24}
[data-theme=note] header h1{font-size:26px;font-weight:700}
[data-theme=note] .search input{border:1px solid var(--line2)}
[data-theme=note] .ph{background:repeating-linear-gradient(-45deg,#F4E9D4 0 6px,#F0E3CA 6px 12px)}
[data-theme=note] .ph h2{font-size:15.5px}
[data-theme=note] .keep li{border-bottom:1px dashed var(--line);border-radius:0}
[data-theme=note] .panel{position:relative}
[data-theme=note] .panel::before{content:"";position:absolute;top:-7px;left:50%;width:70px;height:16px;margin-left:-35px;background:rgba(214,190,140,.55);transform:rotate(-2deg)}
[data-theme=note] .grid,[data-theme=note] .panel{margin-top:26px}
[data-theme=note] .grid .panel{margin-top:0}

/* 나이트: 어두운 화면, 밤 근무용 */
[data-theme=night]{color-scheme:dark;--bg:#0F1623;--panel:#172133;--ink:#E3E8F0;--sub:#93A1B6;--faint:#64748B;--line:#26334A;--line2:#34445E;--head:#0B111C;--headink:#E3E8F0;
  --sbg:#172133;--sph:#64748B;--field:#0F1623;--th:#1B2639;--hover:#1C283B;--donebg:#141D2C;--numc:#7DD3FC;--accent:#38BDF8;--accentbg:#0C2A3D;
  --starbg:rgba(250,204,21,.08);--staroff:#33415A;--star:#FACC15;--ok:#34D399;--okbg:#0B2E24;--red:#F87171;--redbg:#3A1717;--hl:#854D0E;--radius:12px}
[data-theme=night] .btn.pri{color:#0B111C;font-weight:700}
[data-theme=night] .cell::placeholder{color:#3D4C64}
[data-theme=night] .banner{border-color:#5B2424;color:#FCA5A5}
[data-theme=night] .banner.info{border-color:#1E4A66;color:#7DD3FC}
[data-theme=night] .kind.k-수리{color:#FBBF24}[data-theme=night] .kind.k-전산{color:#7DD3FC}

/* 파스텔: 부드럽고 동글동글 */
[data-theme=soft]{--bg:#FFF6F1;--panel:#fff;--ink:#4A3A3F;--sub:#9A8288;--faint:#C2AFB3;--line:#F5E6E0;--line2:#EED6CE;
  --head:linear-gradient(115deg,#FBC4CF 0%,#FDDCB9 50%,#C6E8DC 100%);--headink:#5A3A42;--sbg:rgba(255,255,255,.6);--sph:#B08C93;--field:#fff;
  --th:#FFF4EF;--hover:#FFF9F6;--donebg:#FFFBF9;--numc:#D9607F;--accent:#E7728F;--accentbg:#FFEFF3;--starbg:#FFF6D8;--star:#F2A516;
  --radius:20px;--pborder:0;--shadow:0 6px 22px rgba(231,114,143,.10)}
[data-theme=soft] header .wrap{padding-top:20px;padding-bottom:20px}
[data-theme=soft] header{border-radius:0 0 28px 28px}
[data-theme=soft] header h1{font-size:22px}
[data-theme=soft] .btn{border-radius:20px}
[data-theme=soft] .btn.pri{box-shadow:0 3px 10px rgba(231,114,143,.35)}
[data-theme=soft] .search input{border-radius:20px}
[data-theme=soft] .ph{border-bottom:2px dotted var(--line2)}
[data-theme=soft] .keep li{border-radius:12px}
[data-theme=soft] .ph .n{background:var(--accentbg);color:var(--accent)}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11px}
  header{background:none;color:#000;border-bottom:2px solid #000}
  .search,.sinfo,.foot,.banner,.addline,.rowtools,.ph .btn,.ph .hint,#toast{display:none!important}
  .wrap{padding:0;max-width:none}
  .grid{grid-template-columns:2fr 1fr}
  .panel{border:1px solid #999;border-radius:0;break-inside:avoid-page}
  .cell{border:0!important;padding:2px 4px;min-height:0}
  .tbl td,.tbl th{border:1px solid #999}
  .hide{display:table-row!important}
  tr.grp{display:none!important}
}
</style></head><body>
<header><div class="wrap">
  <h1>응급실 인계정리</h1><span class="date" id="today"></span>
  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="text" id="q" placeholder="전체 검색 (예: 커튼, 로라제팜, 원무과)" autocomplete="off">
    <button class="clr" id="qClr" type="button" title="지우기">✕</button>
  </div>
</div></header>
<div class="sinfo" id="sinfo"></div>

<div class="wrap">
<div id="banner"></div>

<div class="grid">
  <section class="panel" id="secKeep">
    <div class="ph"><h2>KEEP MEMO</h2><span class="n" id="nKeep"></span><span class="sp"></span><span class="hint">계속 지켜야 할 것 · ★ 중요 표시</span></div>
    <ul class="keep" id="keep"></ul>
    <button class="addline" data-add="keep" type="button">+ 메모 추가</button>
  </section>
  <section class="panel" id="secContact">
    <div class="ph"><h2>연락처</h2><span class="n" id="nContact"></span></div>
    <table class="contacts"><tbody id="contacts"></tbody></table>
    <button class="addline" data-add="contacts" type="button">+ 연락처 추가</button>
  </section>
</div>

<section class="panel" id="secItems">
  <div class="ph"><h2>인계내용</h2><span class="n" id="nItems"></span><span class="sp"></span><button class="btn pri" data-add="items" type="button">+ 인계 추가</button></div>
  <table class="tbl">
    <colgroup><col style="width:88px"><col><col style="width:72px"><col style="width:32%"><col style="width:62px"></colgroup>
    <thead><tr><th class="c">날짜</th><th>인계내용</th><th class="c">해결</th><th>기타메모</th><th></th></tr></thead>
    <tbody id="items"></tbody>
  </table>
</section>

<section class="panel" id="secRepairs">
  <div class="ph"><h2>수리 · 전산 요청</h2><span class="n" id="nRepairs"></span><span class="sp"></span><button class="btn pri" data-add="repairs" type="button">+ 요청 추가</button></div>
  <table class="tbl">
    <colgroup><col style="width:88px"><col style="width:70px"><col><col style="width:18%"><col style="width:72px"><col style="width:24%"><col style="width:40px"></colgroup>
    <thead><tr><th class="c">날짜</th><th class="c">구분</th><th>요청 내용</th><th>요청처 · 접수번호</th><th class="c">해결</th><th>기타메모</th><th></th></tr></thead>
    <tbody id="repairs"></tbody>
  </table>
</section>

<div class="foot">
  <div class="themes" id="themes"><span>디자인</span></div>
</div>
<div class="foot" style="margin-top:10px">
  <span id="saveInfo"></span><span class="sp"></span>
  <button class="btn" id="bLink" type="button" style="display:none">🔗 저장 파일 연결</button>
  <button class="btn" id="bExport" type="button">백업 저장</button>
  <button class="btn" id="bImport" type="button">백업 불러오기</button>
  <button class="btn" id="bPrint" type="button">인쇄</button>
  <input type="file" id="fImport" accept=".json,application/json" style="display:none">
</div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var KEY='er-handover-v2';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})};
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
var DOW='일월화수목금토';
function show(s){if(!s)return '';var p=s.split('-');var d=new Date(+p[0],p[1]-1,+p[2]);return (+p[1])+'/'+(+p[2])+' ('+DOW[d.getDay()]+')'}
function short(s){if(!s)return '';var p=s.split('-');return (+p[1])+'/'+(+p[2])}
/* "11/3", "11.3", "1103", "2026-11-03" → ISO */
function parse(v){
  v=String(v||'').trim();if(!v)return '';
  var m=v.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/), y=new Date().getFullYear(), mo, d;
  if(m){y=+m[1];mo=+m[2];d=+m[3]}
  else if((m=v.match(/^(\d{1,2})\s*[/.\-월]\s*(\d{1,2})/))){mo=+m[1];d=+m[2]}
  else if((m=v.match(/^(\d{2})(\d{2})$/))){mo=+m[1];d=+m[2]}
  else return null;
  if(mo<1||mo>12||d<1||d>31)return null;
  var dt=new Date(y,mo-1,d);
  if(!m[0].match(/^\d{4}/)&&dt-new Date()>150*864e5)dt.setFullYear(y-1); /* 5개월 넘게 미래면 작년 */
  return iso(dt);
}
function ago(s){var p=s.split('-');return Math.round((new Date(new Date().toDateString())-new Date(+p[0],p[1]-1,+p[2]))/864e5)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- 데이터 ---------- */
var data;
function blank(){return{keep:[],contacts:[],items:[],repairs:[],savedAt:0}}
function norm(d){d=d||{};var b=blank();for(var k in b)if(d[k]==null)d[k]=b[k];return d}
function load(){try{data=norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){data=blank()}}
var fileHandle=null,savedHandle=null,timer=null;
function save(){
  data.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('⚠ 저장 실패 — 백업 저장을 눌러주세요')}
  if(fileHandle)fileHandle.createWritable().then(function(w){return w.write(JSON.stringify(data,null,1)).then(function(){return w.close()})})
    .catch(function(){fileHandle=null;banner();toast('⚠ 저장 파일에 쓰지 못했어요')});
  stamp();
}
function saveSoon(){clearTimeout(timer);timer=setTimeout(save,350)}
function stamp(){
  var t=data.savedAt?new Date(data.savedAt):null;
  $('saveInfo').textContent=(t?'자동 저장됨 '+pad(t.getHours())+':'+pad(t.getMinutes())+' · ':'')+(fileHandle?'파일 "'+fileHandle.name+'"에도 저장 중':'이 PC 브라우저에 저장 — 가끔 백업 저장을 눌러 두세요');
}
function find(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i]}

/* ---------- 렌더 ---------- */
function ta(field,val,ph,cls){return '<textarea class="cell '+(cls||'')+'" rows="1" data-f="'+field+'" placeholder="'+(ph||'')+'">'+esc(val)+'</textarea>'}
function dateCell(v){return '<input class="cell date" data-f="date" value="'+esc(v?show(v):'')+'" placeholder="날짜">'}
function chk(it){return '<div class="chk"><input type="checkbox" data-a="done"'+(it.done?' checked':'')+' title="해결">'+(it.done&&it.doneDate?'<small>'+short(it.doneDate)+'</small>':'')+'</div>'}

function renderKeep(){
  var L=data.keep.slice().sort(function(a,b){return (b.star?1:0)-(a.star?1:0)});
  $('keep').innerHTML=L.length?L.map(function(it){
    return '<li data-id="'+it.id+'" class="'+(it.star?'star':'')+'"><button class="starbtn'+(it.star?' on':'')+'" data-a="star" type="button" title="중요">★</button>'+
      ta('text',it.text,'계속 기억해야 할 내용')+'<span class="rowtools"><button class="ico" data-a="toItems" type="button" title="인계내용으로 옮기기">↓</button><button class="ico del" data-a="del" type="button" title="삭제">✕</button></span></li>'}).join('')
    :'<li style="color:var(--faint);padding:10px 8px;font-size:13px">아직 메모가 없어요</li>';
  $('nKeep').textContent=data.keep.length||'';
}
function renderContacts(){
  $('contacts').innerHTML=data.contacts.length?data.contacts.map(function(it){
    return '<tr data-id="'+it.id+'"><td>'+ta('name',it.name,'부서 / 이름')+'</td><td class="num">'+ta('num',it.num,'번호')+'</td><td style="width:30px"><span class="rowtools"><button class="ico del" data-a="del" type="button" title="삭제">✕</button></span></td></tr>'}).join('')
    :'<tr><td colspan="3" style="color:var(--faint);padding:10px 8px;font-size:13px">아직 연락처가 없어요</td></tr>';
  $('nContact').textContent=data.contacts.length||'';
}
function sortRows(list){
  var open=list.filter(function(i){return !i.done});
  var done=list.filter(function(i){return i.done}).sort(function(a,b){return (a.doneDate||'')<(b.doneDate||'')?1:-1});
  /* 적은 순서 그대로 (★ 중요만 위로) */
  var star=open.filter(function(i){return i.star});open=star.concat(open.filter(function(i){return !i.star}));
  return {open:open,done:done};
}
var showDone={items:false,repairs:false};
function rowItem(it){
  var cls=(it.done?'done ':'')+(it.star&&!it.done?'st ':'');
  return '<tr data-id="'+it.id+'" class="'+cls+(it.done&&!showDone.items?' hide dn':it.done?' dn':'')+'">'+
    '<td>'+dateCell(it.date)+'</td><td>'+ta('text',it.text,'인계내용','txt')+'</td><td>'+chk(it)+'</td><td>'+ta('memo',it.memo,'예: 11/5 받음, 창고에 넣어둠')+'</td>'+
    '<td><span class="rowtools"><button class="starbtn'+(it.star?' on':'')+'" data-a="star" type="button" title="중요">★</button><button class="ico" data-a="toKeep" type="button" title="KEEP MEMO로 옮기기">↑</button><button class="ico del" data-a="del" type="button" title="삭제">✕</button></span></td></tr>';
}
function rowRepair(it){
  var cls=(it.done?'done ':'')+(!it.done&&it.date&&ago(it.date)>=7?'old':'');
  var k=it.kind||'수리';
  return '<tr data-id="'+it.id+'" class="'+cls+(it.done&&!showDone.repairs?' hide dn':it.done?' dn':'')+'">'+
    '<td>'+dateCell(it.date)+'</td><td><select class="kind k-'+k+'" data-f="kind">'+['수리','전산','기타'].map(function(o){return '<option'+(o===k?' selected':'')+'>'+o+'</option>'}).join('')+'</select></td>'+
    '<td>'+ta('text',it.text,'예: 3번 베드 모니터 전원 안 켜짐','txt')+'</td><td>'+ta('to',it.to,'의공팀 / 전산 #1234')+'</td><td>'+chk(it)+'</td><td>'+ta('memo',it.memo,'예: 11/5 수리 완료')+'</td>'+
    '<td><span class="rowtools"><button class="ico del" data-a="del" type="button" title="삭제">✕</button></span></td></tr>';
}
function renderTable(kind){
  var s=sortRows(data[kind]), cols=kind==='items'?5:7, f=kind==='items'?rowItem:rowRepair;
  var h=s.open.map(f).join('');
  if(!s.open.length)h+='<tr class="empty"><td colspan="'+cols+'">'+(s.done.length?'모두 해결됐어요 👍':'"+ '+(kind==='items'?'인계':'요청')+' 추가"를 눌러 시작하세요')+'</td></tr>';
  if(s.done.length)h+='<tr class="grp" data-a="toggleDone"><td colspan="'+cols+'">'+(showDone[kind]?'▾':'▸')+' 해결됨 '+s.done.length+'건 '+(showDone[kind]?'숨기기':'보기')+'</td></tr>'+s.done.map(f).join('');
  $(kind).innerHTML=h;
  var n=$(kind==='items'?'nItems':'nRepairs'),c=s.open.length;
  n.textContent=c?'미해결 '+c:'';n.className='n'+(c?' red':'');
}
function render(){renderKeep();renderContacts();renderTable('items');renderTable('repairs');grow(document);applySearch();$('today').textContent=show(today())}
function grow(root){root.querySelectorAll('textarea.cell').forEach(fit)}
function fit(t){t.style.height='auto';t.style.height=t.scrollHeight+2+'px'}

/* ---------- 편집 ---------- */
function listOf(el){var s=el.closest('section');return {secKeep:'keep',secContact:'contacts',secItems:'items',secRepairs:'repairs'}[s&&s.id]}
document.addEventListener('input',function(e){
  var t=e.target,f=t.getAttribute('data-f');if(!f||f==='date')return;
  var row=t.closest('[data-id]'),k=listOf(t);if(!row||!k)return;
  var it=find(data[k],row.getAttribute('data-id'));if(!it)return;
  it[f]=t.value;if(t.tagName==='TEXTAREA')fit(t);
  if(f==='kind'){t.className='kind k-'+t.value;save()}else saveSoon();
});
document.addEventListener('change',function(e){
  var t=e.target;if(t.getAttribute('data-f')!=='date')return;
  var row=t.closest('[data-id]'),k=listOf(t),it=find(data[k],row.getAttribute('data-id'));
  var v=parse(t.value);
  if(v===null){toast('날짜는 11/3 처럼 적어주세요');t.value=it.date?show(it.date):'';return}
  it.date=v;save();renderTable(k);grow($(k));applySearch();
});
document.addEventListener('focusin',function(e){var t=e.target;if(t.getAttribute&&t.getAttribute('data-f')==='date'&&t.value)t.value=t.value.replace(/\s*\(.\)$/,'');});
document.addEventListener('focusout',function(e){var t=e.target;if(t.getAttribute&&t.getAttribute('data-f')==='date'){var p=parse(t.value);if(p)t.value=show(p)}});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Enter'&&t.getAttribute&&t.getAttribute('data-f')==='date'){t.blur();return}
  if(e.key==='Escape'&&t.id==='q'){t.value='';applySearch()}
});

document.addEventListener('click',function(e){
  var add=e.target.closest('[data-add]');
  if(add){addRow(add.getAttribute('data-add'));return}
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a'),k=listOf(b);
  if(a==='toggleDone'){showDone[k]=!showDone[k];renderTable(k);grow($(k));applySearch();return}
  var row=b.closest('[data-id]');if(!row)return;
  var id=row.getAttribute('data-id'),it=find(data[k],id);if(!it)return;
  if(a==='star'){it.star=!it.star;save();k==='keep'?renderKeep():renderTable(k);grow(document);applySearch();return}
  if(a==='done'){
    /* 줄을 바로 숨기지 않고 그 자리에서 표시만 바꿈 → 기타메모를 바로 적을 수 있게 (정리는 다음 화면 갱신 때) */
    it.done=b.checked;it.doneDate=b.checked?today():'';
    if(b.checked&&!it.memo)it.memo=short(today())+' ';
    save();
    row.classList.toggle('done',it.done);row.classList.toggle('dn',it.done);row.classList.remove('old','st');
    b.parentNode.innerHTML=chk(it).replace(/^<div class="chk">|<\/div>$/g,'');
    var m=row.querySelector('[data-f=memo]');
    if(it.done&&m){m.value=it.memo;m.focus();m.setSelectionRange(m.value.length,m.value.length);toast('해결 ✓ 기타메모에 결과를 적어두세요')}
    var c=sortRows(data[k]).open.length,n=$(k==='items'?'nItems':'nRepairs');n.textContent=c?'미해결 '+c:'';n.className='n'+(c?' red':'');
    return;
  }
  if(a==='del'){
    var label=(it.text||it.name||'').slice(0,30);
    if(!confirm('삭제할까요?'+(label?'\n\n"'+label+'"':'')))return;
    data[k]=data[k].filter(function(x){return x.id!==id});save();render();return;
  }
  if(a==='toKeep'){data.items=data.items.filter(function(x){return x.id!==id});data.keep.push({id:id,text:it.text,star:!!it.star});save();render();toast('KEEP MEMO로 옮겼어요');return}
  if(a==='toItems'){data.keep=data.keep.filter(function(x){return x.id!==id});data.items.push({id:id,date:today(),text:it.text,done:false,doneDate:'',memo:'',star:!!it.star});save();render();toast('인계내용으로 옮겼어요');return}
});
function addRow(k){
  var it={id:uid()};
  if(k==='keep'){it.text='';it.star=false}
  else if(k==='contacts'){it.name='';it.num=''}
  else{it.date=today();it.text='';it.done=false;it.doneDate='';it.memo='';if(k==='repairs'){it.kind='수리';it.to=''}}
  data[k].push(it);
  if($('q').value){$('q').value='';}
  save();render();
  var el=document.querySelector('[data-id="'+it.id+'"] '+(k==='contacts'?'[data-f=name]':'[data-f=text]'));
  if(el){el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}
}

/* ---------- 검색 ---------- */
function applySearch(){
  var q=$('q').value.trim().toLowerCase();
  $('searchBox').classList.toggle('has',!!q);
  var total=0;
  document.querySelectorAll('[data-id]').forEach(function(row){
    if(!q){row.style.display='';return}
    var txt=[].map.call(row.querySelectorAll('[data-f]'),function(x){return x.value}).join(' ').toLowerCase();
    var hit=txt.indexOf(q)>=0;row.style.display=hit?'':'none';
    if(hit){total++;if(row.classList.contains('dn'))row.classList.remove('hide')}
  });
  document.querySelectorAll('.grp,.empty').forEach(function(r){r.style.display=q?'none':''});
  if(!q)['items','repairs'].forEach(function(k){if(!showDone[k])$(k).querySelectorAll('tr.dn').forEach(function(r){r.classList.add('hide')})});
  var si=$('sinfo');si.classList.toggle('on',!!q);
  si.innerHTML=q?'"<b>'+esc(q)+'</b>" 검색 결과 '+total+'건 (해결된 것 포함) · <a href="#" id="sx">검색 지우기</a>':'';
  if(q){var x=$('sx');x.onclick=function(ev){ev.preventDefault();$('q').value='';applySearch()}}
  if(q)grow(document);
}
$('q').addEventListener('input',applySearch);
$('qClr').onclick=function(){$('q').value='';applySearch();$('q').focus()};
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();$('q').focus();$('q').select()}});

/* ---------- 저장 파일 / 백업 ---------- */
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2300)}
function idb(fn){
  if(!window.indexedDB)return Promise.reject();
  return new Promise(function(res,rej){var r=indexedDB.open('er-handover-fs',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('h')};
    r.onsuccess=function(){var tx=r.result.transaction('h','readwrite'),q=fn(tx.objectStore('h'));tx.oncomplete=function(){res(q&&q.result)};tx.onerror=function(){rej(tx.error)}};
    r.onerror=function(){rej(r.error)}});
}
function banner(){
  var B=$('banner');
  if(savedHandle&&!fileHandle){
    B.innerHTML='<div class="banner"><span>저장 파일 <b>'+esc(savedHandle.name)+'</b>과 연결이 끊겨 있어요.</span><button class="btn" id="reLink" type="button">다시 연결</button></div>';
    $('reLink').onclick=function(){savedHandle.requestPermission({mode:'readwrite'}).then(function(p){if(p==='granted')useHandle(savedHandle)})};
  }else if(!data.savedAt&&!data.keep.length&&!data.items.length){
    B.innerHTML='<div class="banner info"><span>처음이신가요? 받은 <b>인계 데이터 파일(.json)</b>이 있으면 불러오세요.</span><button class="btn" id="firstImp" type="button">파일 불러오기</button></div>';
    $('firstImp').onclick=function(){$('fImport').click()};
  }else B.innerHTML='';
  stamp();
}
function useHandle(h){
  return h.getFile().then(function(f){return f.text()}).then(function(t){
    var d=null;try{d=t?JSON.parse(t):null}catch(e){}
    if(d&&d.items&&(d.savedAt||0)>(data.savedAt||0))data=norm(d);
    fileHandle=h;savedHandle=h;idb(function(s){return s.put(h,'file')}).catch(function(){});
    save();render();banner();toast('저장 파일과 연결됐어요');
  }).catch(function(){toast('파일을 열지 못했어요')});
}
if(window.showSaveFilePicker){
  $('bLink').style.display='';
  $('bLink').onclick=function(){
    window.showSaveFilePicker({suggestedName:'응급실인계_데이터.json',types:[{description:'인계 데이터',accept:{'application/json':['.json']}}]}).then(useHandle).catch(function(){});
  };
  idb(function(s){return s.get('file')}).then(function(h){
    if(!h)return;savedHandle=h;
    return h.queryPermission({mode:'readwrite'}).then(function(p){if(p==='granted')useHandle(h);else banner()});
  }).catch(function(){});
}
$('bExport').onclick=function(){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));
  a.download='응급실인계_백업_'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
};
$('bImport').onclick=function(){$('fImport').click()};
$('fImport').onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    var d;try{d=JSON.parse(r.result);if(!d||!(d.items||d.keep))throw 0}catch(e){alert('인계 데이터 파일이 아니에요.');return}
    var empty=!data.keep.length&&!data.items.length&&!data.repairs.length&&!data.contacts.length;
    if(empty||confirm('지금 내용을 이 파일 내용으로 바꿀까요?\n(지금 내용은 사라집니다. 필요하면 먼저 "백업 저장"을 누르세요)')){data=norm(d);save();render();banner();toast('불러왔어요')}
  };
  r.readAsText(f,'utf-8');this.value='';
};
$('bPrint').onclick=function(){window.print()};

/* ---------- 디자인 ---------- */
var THEMES=[['','기본','#1E3A5F'],['doc','서류형','#fff'],['note','노트','#EFE6D6'],['night','나이트','#0F1623'],['soft','파스텔','linear-gradient(135deg,#FBC4CF,#C6E8DC)']];
function setTheme(t){
  if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem('er-handover-theme',t)}catch(e){}
  document.querySelectorAll('.th').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
  grow(document);
}
$('themes').insertAdjacentHTML('beforeend',THEMES.map(function(x){return '<button class="th" type="button" data-t="'+x[0]+'"><i style="background:'+x[2]+'"></i>'+x[1]+'</button>'}).join(''));
$('themes').onclick=function(e){var b=e.target.closest('.th');if(b)setTheme(b.getAttribute('data-t'))};
setTheme(document.documentElement.getAttribute('data-theme')||'');

/* ---------- 시작 ---------- */
load();render();banner();
var lastDay=today();setInterval(function(){if(today()!==lastDay){lastDay=today();render()}},60000);
window.addEventListener('resize',function(){grow(document)});
})();
</script></body></html>
