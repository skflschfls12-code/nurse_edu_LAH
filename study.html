<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>교육 체크리스트 · 질문</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css");
*{box-sizing:border-box}
body{margin:0;background:#F6F4EF;color:#20242B;font-family:Pretendard,sans-serif;font-size:15.5px;line-height:1.68;letter-spacing:-.015em;word-break:keep-all}
main{max-width:600px;margin:0 auto;padding:22px 14px 70px}
h1{font-size:1.45rem;font-weight:800;letter-spacing:-.035em;margin:0 0 18px;padding:20px 16px;line-height:1.35;text-align:center;background:#fff;border:2px solid #20242B;border-radius:14px;box-shadow:4px 4px 0 #20242B}
h2{font-size:.9rem;font-weight:800;margin:28px 2px 10px;background:#20242B;color:#fff;display:inline-block;padding:5px 13px;border-radius:20px}
.card{background:#fff;border:2px solid #20242B;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:3px 3px 0 rgba(32,36,43,.18)}
.head{display:flex;gap:10px;align-items:center;margin-bottom:8px;padding-bottom:9px;border-bottom:2px dashed #E0DCD2}
.head h3{margin:0;font-size:1rem;font-weight:700;line-height:1.45;letter-spacing:-.02em;flex:1}
.num{background:var(--c);color:#fff;font-weight:800;font-size:.85rem;width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none}
figure img{border-radius:8px}
figcaption{font-size:.82rem;color:#6E6A61;margin-top:7px;text-align:center}
.txt{margin-top:11px;font-size:.93rem;line-height:1.65}
.note{background:#FFF9E3;border:1.5px solid #E8D98A;border-radius:10px;padding:11px 13px;margin-top:12px;font-size:.9rem;line-height:1.62}
.note::before{content:"💡 ";}
.warn{background:#FFEFEF;border:1.5px solid #EDBCBC;border-radius:10px;padding:11px 13px;margin-top:12px;font-size:.9rem;line-height:1.62}
.warn::before{content:"⚠️ ";}
.note p,.warn p{margin:0;display:inline}
mark{background:#FFE072;padding:0 3px;border-radius:3px}
.hs{margin:14px 0 0}
.hswrap{position:relative;display:block;line-height:0}
.hswrap img{width:100%;border-radius:8px;cursor:default}
.dot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#20242B;color:#fff;font:inherit;font-size:.82rem;font-weight:800;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4);padding:0}
.dot.on{background:#D2691E;transform:translate(-50%,-50%) scale(1.15)}
.hsinfo{background:#F4F2ED;border:1.5px solid #E0DCD2;border-radius:10px;padding:11px 13px;margin-top:10px;font-size:.9rem;line-height:1.6;text-align:left;color:#4A4E56}
.hsinfo .nm{font-weight:700;color:#20242B;display:block;font-size:.97rem;margin-bottom:2px}
.lnk{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid #20242B;color:#20242B;text-decoration:none;padding:15px 17px;border-radius:12px;margin:10px 0 0;font-weight:700;font-size:.97rem;box-shadow:3px 3px 0 rgba(32,36,43,.18)}
.lnk::after{content:"→"}

figure{margin:14px 0 0}figure img{max-width:100%;display:block;margin:0 auto;cursor:zoom-in}
figure video{width:100%;background:#000}
.embed{position:relative;padding-top:56.25%;margin:14px 0 0}.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
#zoom{position:fixed;inset:0;background:rgba(8,14,20,.95);display:none;overflow:auto;z-index:9;padding:56px 10px 20px;text-align:center}
#zoom img{max-width:none;width:auto;border-radius:0}
#zoom .x{position:fixed;top:12px;right:14px;background:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600}
b{font-weight:700}

.box{background:#fff;border:2px solid #20242B;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:3px 3px 0 rgba(32,36,43,.18)}
label.l{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
input.t,textarea.t{width:100%;font:inherit;font-size:1rem;padding:11px 12px;border:1.5px solid #20242B;border-radius:10px;background:#fff}
textarea.t{min-height:110px;resize:vertical}
.btn{display:block;width:100%;margin-top:10px;font:inherit;font-weight:800;font-size:1rem;background:#20242B;color:#fff;border:0;border-radius:10px;padding:13px;cursor:pointer}
.btn:disabled{opacity:.5}
.who{display:flex;justify-content:space-between;align-items:center;margin:-6px 2px 14px;font-size:.9rem;color:#4A4E56}
.who a{color:#6E6A61;font-size:.85rem}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;font:inherit;font-weight:800;font-size:.95rem;padding:11px;border-radius:10px;border:2px solid #20242B;background:#fff;color:#20242B;cursor:pointer}
.tabs button.on{background:#20242B;color:#fff}
.prog{height:10px;background:#E8E4DA;border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:#1F9E6E;border-radius:6px;transition:width .2s}
.pt{font-size:.85rem;color:#6E6A61;margin-top:6px}
.day{background:#fff;border:2px solid #20242B;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:3px 3px 0 rgba(32,36,43,.18)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font-weight:800;border-bottom:2px dashed #E0DCD2}
.dh span{font-size:.82rem;color:#6E6A61;font-weight:700}
.dh.all span{color:#1F9E6E}
.it{display:flex;gap:11px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid #F0EDE6;cursor:pointer;font-size:.95rem;line-height:1.55}
.it:last-child{border-bottom:0}
.it input{width:21px;height:21px;margin:1px 0 0;accent-color:#1F9E6E;flex:none}
.it.ok span{color:#9A968D;text-decoration:line-through}
.qa{background:#fff;border:1.5px solid #20242B;border-radius:12px;padding:13px 14px;margin-bottom:10px}
.qa .qt{font-size:.78rem;color:#9A968D;margin-bottom:4px}
.qa .qq{white-space:pre-wrap;font-size:.95rem}
.qa .aa{margin-top:10px;background:#EAF6EF;border-radius:9px;padding:10px 12px;font-size:.92rem;white-space:pre-wrap}
.qa .aa b{display:block;font-size:.78rem;color:#1F7A56;margin-bottom:2px}
.qa .wait{margin-top:9px;font-size:.82rem;color:#B07A1E;font-weight:700}

.cal{background:#fff;border:2px solid #20242B;border-radius:14px;padding:12px 10px;margin-bottom:14px;box-shadow:3px 3px 0 rgba(32,36,43,.18)}
.cg{display:grid;grid-template-columns:repeat(var(--cols,7),1fr);gap:5px}
.cg.hd div{text-align:center;font-size:.78rem;font-weight:800;color:#6E6A61;padding-bottom:4px}
.cg.hd div.sat{color:#2E6FD9}.cg.hd div.sun{color:#D93B3B}
.wl{font-size:.78rem;font-weight:800;color:#20242B;margin:10px 2px 5px}
.cell{aspect-ratio:1/1.12;border:1.5px solid #D8D3C7;border-radius:10px;background:#FBFAF7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;font:inherit;cursor:pointer;color:#20242B}
.cell.empty{border:1.5px dashed #ECE8DF;background:none;cursor:default}
.cell small{font-size:.68rem;font-weight:700;color:#8A857B}
.cell.done{background:#E6F4EC;border-color:#1F9E6E}.cell.done small{color:#1F7A56}
.cell.sel{border:2.5px solid #20242B;box-shadow:2px 2px 0 rgba(32,36,43,.25)}
.sh{font-style:normal;font-size:.7rem;font-weight:800;color:#fff;background:#9A968D;border-radius:5px;padding:1px 5px;line-height:1.4}
.sh.sD{background:#E0A526}.sh.sE{background:#D9642E}.sh.sN{background:#34457E}
.pl{font-size:.8rem;color:#6E6A61;margin:0 2px 8px;font-weight:700}
.gd{background:#FFF9E3;border:2px solid #20242B;border-radius:14px;padding:15px 16px;margin-top:4px;box-shadow:3px 3px 0 rgba(32,36,43,.18)}
.gd h3{margin:0 0 8px;font-size:1rem;font-weight:800}
.gd ul{margin:0;padding-left:18px}.gd li{margin:4px 0;font-size:.93rem;line-height:1.6}
.hide{display:none}
.err{color:#C0392B;font-size:.88rem;margin-top:8px}
</style></head><body><main>
<h1>교육 체크리스트 · 질문</h1>

<section id="login" class="hide">
  <div class="box">
    <label class="l" for="uid">아이디</label>
    <input class="t" id="uid" autocomplete="off" autocapitalize="off" placeholder="교육 담당 선생님께 받은 아이디">
    <button class="btn" id="goBtn">들어가기</button>
    <p class="err" id="lerr"></p>
  </div>
</section>

<section id="app" class="hide">
  <div class="who"><span id="whoName"></span><a href="#" id="outBtn">나가기</a></div>
  <div class="tabs"><button id="tC" class="on">체크리스트</button><button id="tQ">질문하기</button></div>

  <div id="pC">
    <div class="box"><b>전체 진행</b><div class="prog"><i id="bar" style="width:0"></i></div><div class="pt" id="ptxt"></div></div>
    <div id="days"><div class="note">불러오는 중...</div></div>
    <div id="guide"></div>
  </div>

  <div id="pQ" class="hide">
    <div class="warn">환자 이름, 등록번호 등 <b>환자 정보는 적지 마세요.</b></div>
    <div class="box" style="margin-top:12px">
      <label class="l" for="qtext">궁금한 것</label>
      <textarea class="t" id="qtext" placeholder="근무 중에 궁금했던 걸 편하게 남겨주세요."></textarea>
      <button class="btn" id="askBtn">질문 남기기</button>
      <p class="err" id="qerr"></p>
    </div>
    <div id="qlist"></div>
  </div>
</section>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycby9WJJxUV7SWOJMRPdB5ggOtnbMKxeI395sdZplFIriET5xto-vJ7NNddwFWMvRu4vM/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let ID='';
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
async function call(p){
  const r=await fetch(API,{method:'POST',body:JSON.stringify(p)});
  return r.json();
}
function show(which){$('login').classList.toggle('hide',which!=='login');$('app').classList.toggle('hide',which!=='app')}
async function login(id){
  $('lerr').textContent='';$('goBtn').disabled=true;$('goBtn').textContent='확인 중...';
  try{const r=await call({action:'login',id});
    if(!r.ok){$('lerr').textContent='등록되지 않은 아이디예요. 담당 선생님께 확인해 주세요.';store('sid',null);show('login');return}
    ID=id;store('sid',id);$('whoName').textContent=r.me.name+' 선생님 ('+r.me.type+')';show('app');loadChecklist();
  }catch(e){$('lerr').textContent='연결에 실패했어요. 잠시 후 다시 시도해 주세요.';show('login')}
  finally{$('goBtn').disabled=false;$('goBtn').textContent='들어가기'}
}
$('goBtn').onclick=()=>{const v=$('uid').value.trim();if(v)login(v)};
$('uid').onkeydown=e=>{if(e.key==='Enter')$('goBtn').click()};
$('outBtn').onclick=e=>{e.preventDefault();store('sid',null);ID='';$('uid').value='';show('login')};
function tab(t){$('tC').classList.toggle('on',t==='C');$('tQ').classList.toggle('on',t==='Q');
  $('pC').classList.toggle('hide',t!=='C');$('pQ').classList.toggle('hide',t!=='Q');if(t==='Q')loadQ()}
$('tC').onclick=()=>tab('C');$('tQ').onclick=()=>tab('Q');

let items=[],done={},sel=null;
const DOW=['월','화','수','목','금','토','일'];
const isDone=it=>!!done[it.day+'|'+it.text];
function parse(l){
  const m=String(l).trim().match(/^(?:(\d+)\s*주(?:차)?\s*)?(월|화|수|목|금|토|일)(?:요일)?\s*(D|E|N|d|e|n|데이|이브닝|나이트)?$/);
  if(!m)return null;
  const map={d:'D',e:'E',n:'N','데이':'D','이브닝':'E','나이트':'N'};
  const s=m[3]?(map[m[3].toLowerCase()]||m[3].toUpperCase()):'';
  return{wk:+(m[1]||1),dow:DOW.indexOf(m[2]),sh:s};
}
function progress(){
  const n=items.length,d=items.filter(isDone).length;
  $('bar').style.width=(n?Math.round(d/n*100):0)+'%';$('ptxt').textContent=n?(d+' / '+n+' 완료'):'';
  document.querySelectorAll('.day').forEach(el=>{
    const day=el.dataset.day,list=items.filter(it=>it.day===day),dd=list.filter(isDone).length;
    const hh=el.querySelector('.dh');hh.querySelector('span').textContent=dd+' / '+list.length;hh.classList.toggle('all',dd===list.length)});
}
function dayBox(label){
  return '<div class="day" data-day="'+esc(label)+'"><div class="dh">'+esc(label)+'<span></span></div>'+
    items.map((it,i)=>it.day!==label?'':'<label class="it'+(isDone(it)?' ok':'')+'"><input type="checkbox" data-i="'+i+'"'+(isDone(it)?' checked':'')+'><span>'+esc(it.text)+'</span></label>').join('')+'</div>';
}
function render(){
  if(!items.length){$('days').innerHTML='<div class="note">아직 등록된 체크리스트가 없어요.</div>';progress();return}
  const labels=[];items.forEach(it=>{if(!labels.includes(it.day))labels.push(it.day)});
  const P={};let ok=true;labels.forEach(l=>{P[l]=parse(l);if(!P[l])ok=false});
  if(!ok){$('days').innerHTML=labels.map(dayBox).join('');progress();return}
  const weeks=[...new Set(labels.map(l=>P[l].wk))].sort((a,b)=>a-b);
  const info=(w,i)=>{const ls=labels.filter(l=>P[l].wk===w&&P[l].dow===i);const its=items.filter(it=>ls.includes(it.day));return{ls,n:its.length,d:its.filter(isDone).length}};
  if(!sel){
    outer:for(const w of weeks)for(let i=0;i<7;i++){const c=info(w,i);if(c.n&&c.d<c.n){sel=w+'-'+i;break outer}}
    if(!sel)sel=P[labels[0]].wk+'-'+P[labels[0]].dow;
  }
  const used=new Set(labels.map(l=>P[l].dow));
  const cols=[0,1,2,3,4];if(used.has(5)||used.has(6)){cols.push(5,6)}
  let o='<div class="cal" style="--cols:'+cols.length+'"><div class="cg hd">'+cols.map(i=>'<div class="'+(i===5?'sat':i===6?'sun':'')+'">'+DOW[i]+'</div>').join('')+'</div>';
  weeks.forEach(w=>{
    if(weeks.length>1)o+='<div class="wl">'+w+'주</div>';
    o+='<div class="cg">';
    for(const i of cols){const c=info(w,i),k=w+'-'+i;
      if(!c.n){o+='<div class="cell empty"></div>';continue}
      const shs=[...new Set(c.ls.map(l=>P[l].sh).filter(Boolean))];
      o+='<button type="button" class="cell'+(c.d===c.n?' done':'')+(k===sel?' sel':'')+'" data-k="'+k+'">'+
        (shs.length?shs.map(s=>'<i class="sh s'+s+'">'+s+'</i>').join(''):'')+
        '<small>'+(c.d===c.n?'✓ 완료':c.d+'/'+c.n)+'</small></button>'}
    o+='</div>'});
  o+='</div>';
  const[sw,sd]=sel.split('-').map(Number);const c=info(sw,sd);
  o+='<div class="pl">'+(weeks.length>1?sw+'주 ':'')+DOW[sd]+'요일</div>'+c.ls.map(dayBox).join('');
  $('days').innerHTML=o;progress();
}
async function loadChecklist(){
  $('days').innerHTML='<div class="note">불러오는 중...</div>';
  try{const r=await call({action:'checklist',id:ID});if(!r.ok)throw 0;
    items=r.items;done=r.done||{};sel=null;render();
    const g=r.guide||[];
    $('guide').innerHTML=g.length?'<div class="gd"><h3>📌 안내사항</h3><ul>'+g.map(x=>'<li>'+esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</li>').join('')+'</ul></div>':'';
  }catch(e){$('days').innerHTML='<div class="note">체크리스트를 불러오지 못했어요.</div>'}
}
$('days').addEventListener('click',e=>{const b=e.target.closest('.cell[data-k]');if(b){sel=b.dataset.k;render()}});
$('days').addEventListener('change',async e=>{
  const cb=e.target;if(!cb.dataset.i)return;const it=items[+cb.dataset.i];const k=it.day+'|'+it.text;
  const on=cb.checked;if(on)done[k]=true;else delete done[k];render();
  try{const r=await call({action:'check',id:ID,day:it.day,text:it.text,on});if(!r.ok)throw 0}
  catch(x){if(!on)done[k]=true;else delete done[k];render();alert('저장하지 못했어요. 다시 눌러주세요.')}
});
function fmt(t){const d=new Date(t);if(isNaN(d))return '';return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
async function loadQ(){
  $('qlist').innerHTML='<div class="note">불러오는 중...</div>';
  try{const r=await call({action:'questions',id:ID});if(!r.ok)throw 0;
    $('qlist').innerHTML=r.list.length?r.list.map(x=>'<div class="qa"><div class="qt">'+fmt(x.time)+'</div><div class="qq">'+esc(x.q)+'</div>'+
      (x.a?'<div class="aa"><b>답변</b>'+esc(x.a)+'</div>':'<div class="wait">답변을 기다리는 중이에요</div>')+'</div>').join(''):'<div class="note">아직 남긴 질문이 없어요.</div>';
  }catch(e){$('qlist').innerHTML='<div class="note">질문을 불러오지 못했어요.</div>'}
}
$('askBtn').onclick=async()=>{const t=$('qtext').value.trim();if(!t)return;
  $('askBtn').disabled=true;$('askBtn').textContent='보내는 중...';$('qerr').textContent='';
  try{const r=await call({action:'ask',id:ID,text:t});if(!r.ok)throw 0;$('qtext').value='';loadQ()}
  catch(e){$('qerr').textContent='보내지 못했어요. 다시 시도해 주세요.'}
  finally{$('askBtn').disabled=false;$('askBtn').textContent='질문 남기기'}};

if(API.indexOf('__')===0){show('login');$('lerr').textContent='아직 연결 설정이 안 됐어요.';}
else{const s=load('sid');if(s){$('uid').value=s;login(s)}else show('login')}
</script></body></html>
