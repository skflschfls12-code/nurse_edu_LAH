<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>내 환자 파악 노트</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css");
*{box-sizing:border-box}
:root{--ink:#20242B;--bg:#F6F4EF;--line:#E0DCD2;--sub:#6E6A61;--acc:#D2691E}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,sans-serif;font-size:15.5px;line-height:1.6;letter-spacing:-.015em;word-break:keep-all}
main{max-width:600px;margin:0 auto;padding:18px 14px 110px}
h1{font-size:1.3rem;font-weight:800;letter-spacing:-.035em;margin:0 0 6px;padding:16px;text-align:center;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.priv{font-size:.8rem;color:var(--sub);text-align:center;margin:10px 4px 14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.l{background:#fff;color:var(--ink)}
.btn.r{background:#fff;color:#B33;border-color:#B33}
.btn.s{padding:5px 10px;font-size:.85rem;border-width:1.5px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1}
input[type=text],input[type=number],textarea,select{font:inherit;width:100%;padding:9px 11px;border:1.5px solid #CFCABF;border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}

/* list */
.pt{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:13px 14px;margin-bottom:11px;box-shadow:3px 3px 0 rgba(32,36,43,.18);cursor:pointer}
.pt .top{display:flex;align-items:center;gap:8px}
.bed{background:var(--ink);color:#fff;font-weight:800;font-size:.82rem;padding:2px 9px;border-radius:8px;flex:none}
.pt .nm{font-weight:800;font-size:1.05rem;flex:1}
.pt .as{color:var(--sub);font-weight:600;font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:20px;background:#F0EDE6;color:#4A4E56}
.tag.w{background:#FFE5D2;color:#A04A10}
.tag.b{background:#E2ECFA;color:#2A5590}
.tag.g{background:#E3F2E6;color:#2E6B3A}
.pt .cc{font-size:.88rem;color:#4A4E56;margin-top:6px}
.empty{background:#FFF9E3;border:1.5px solid #E8D98A;border-radius:10px;padding:14px;font-size:.92rem;text-align:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;box-shadow:3px 3px 0 rgba(32,36,43,.25);padding:13px 26px;font-size:1rem;border-radius:30px;z-index:5}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}

/* form */
.sec{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px;margin-bottom:12px}
.sec h2{font-size:.85rem;font-weight:800;margin:0 0 10px;background:var(--ink);color:#fff;display:inline-block;padding:3px 12px;border-radius:20px}
.row{display:flex;gap:8px;margin-bottom:9px;align-items:center}
.row>*{flex:1}
.lab{font-size:.84rem;font-weight:700;color:#4A4E56;margin:10px 0 5px}
.lab:first-of-type{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #CFCABF;background:#fff;color:var(--ink);border-radius:20px;padding:6px 13px;font-size:.9rem;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sub{background:#F8F6F1;border:1.5px dashed var(--line);border-radius:10px;padding:10px;margin-top:9px}
.hide{display:none!important}
.item{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px}
.item .x{background:none;border:0;color:#B33;font-weight:700;font-size:.85rem;padding:4px 2px;flex:none}
.dev{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.dev .chip{flex:none;min-width:92px;text-align:center}
.dev input{flex:1}
.dev input:disabled{background:#F2F0EB;color:#aaa}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;display:flex;gap:8px;z-index:4}
.sticky .btn{flex:1;padding:12px}

/* view */
.sum{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px;box-shadow:3px 3px 0 rgba(32,36,43,.18)}
.sum dl{margin:0;display:grid;grid-template-columns:76px 1fr;gap:7px 10px}
.sum dt{font-size:.82rem;font-weight:800;color:var(--sub);padding-top:2px}
.sum dd{margin:0;font-size:.95rem;white-space:pre-wrap}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:.9rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.upd{font-size:.76rem;color:#9A968D;text-align:right;margin-top:10px}

/* devices */
.addb{border:1.5px dashed #9A968D;background:#fff;color:var(--ink);border-radius:20px;padding:6px 12px;font-size:.88rem;font-weight:700}
.addb:active{background:#F0EDE6}
.dv{background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:10px 11px;margin-top:10px}
.dv .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dv .dh b{font-size:.95rem;background:#FFE5D2;color:#A04A10;padding:2px 10px;border-radius:8px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:7px 8px}
.fg label{display:block;font-size:.76rem;font-weight:700;color:var(--sub)}
.fg label.w{grid-column:1/-1}
.fg input{margin-top:2px;padding:7px 9px;width:100%;display:block;font:inherit;border:1.5px solid #CFCABF;border-radius:9px;background:#fff;color:var(--ink);min-height:38px}
.unit{position:relative}.unit input{padding-right:34px}.unit span{position:absolute;right:10px;bottom:8px;font-size:.82rem;color:var(--sub);font-weight:700}
.dday{font-size:.72rem;font-weight:800;color:#2A5590;margin-left:4px}
#vView .sec.esec{border:1.5px dashed #CFCABF;padding:9px 14px;cursor:pointer}
#vView .sec.esec h2{background:#E5E1D8;color:#6E6A61;margin:0}
#vView .sec.esec .et{font-size:.82rem;color:#9A968D;margin-left:8px}
#vView .lines dd{display:flex;flex-direction:column;gap:2px}

/* post-it memo */
.sec{position:relative}
.secwrap>.sec{margin-bottom:12px}
.mbtn{position:absolute;top:11px;right:11px;background:#FFF3A3;border:1.5px solid #E8D98A;color:#7A6A10;border-radius:8px;padding:3px 9px;font-size:.8rem;font-weight:700}
.mbtn.has{background:#FFE45C;border-color:#D9C24A}
.postit{background:#FFF3A3;border-radius:2px 2px 14px 2px;box-shadow:2px 4px 8px rgba(0,0,0,.16);padding:8px 10px 6px;margin:-2px 10px 16px;transform:rotate(-.7deg)}
.postit .ph{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:800;color:#7A6A10}
.postit .px{background:none;border:0;color:#9A8420;font-weight:800;padding:2px 4px}
.postit textarea{background:transparent;border:0;padding:4px 2px;min-height:80px;font-size:.92rem;line-height:1.55;color:#3D3510}
.postit textarea:focus{outline:none}
#vView .sec dl{margin:0;display:grid;grid-template-columns:76px 1fr;gap:7px 10px}
#vView .sec dt{font-size:.82rem;font-weight:800;color:var(--sub);padding-top:2px}
#vView .sec dd{margin:0;font-size:.95rem;white-space:pre-wrap}
.vhead{font-weight:800;font-size:1.15rem;padding-right:70px}
@media (min-width:900px){
  main{max-width:900px}
  #vList{max-width:600px;margin:0 auto}
  .secwrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:start}
  .postit{margin:4px 0 12px;transform:rotate(1.2deg)}
  .secwrap:nth-child(even) .postit{transform:rotate(-1deg)}
}
</style></head><body><main>

<!-- ===== 목록 ===== -->
<section id="vList">
  <h1>📝 내 환자 파악 노트</h1>
  <div class="priv">🔒 입력한 내용은 <b>이 기기 브라우저에만</b> 저장돼요 (서버 전송 없음).<br>개인정보 보호를 위해 이름은 <b>홍○○</b>처럼 줄여 쓰는 걸 권장해요.</div>
  <div class="bar"><input type="text" id="q" placeholder="🔍 이름·베드·증상 검색"></div>
  <div id="list"></div>
  <div class="foot">
    <button class="btn l s" id="bCopyAll">전체 인계 텍스트 복사</button>
    <button class="btn l s" id="bExport">백업 파일 저장</button>
    <button class="btn l s" id="bImport">백업 불러오기</button>
    <button class="btn r s" id="bWipe">전체 삭제</button>
    <input type="file" id="fImport" accept=".json,application/json" class="hide">
  </div>
  <button class="btn fab" id="bAdd">＋ 환자 추가</button>
</section>

<!-- ===== 상세 보기 ===== -->
<section id="vView" class="hide">
  <div class="bar"><button class="btn l s" data-go="list">← 목록</button><span style="flex:1"></span>
    <button class="btn l s" id="vCopy">복사</button><button class="btn s" id="vEdit">수정</button></div>
  <div id="sum"></div>
</section>

<!-- ===== 입력/수정 ===== -->
<section id="vEditF" class="hide">
  <div class="bar"><button class="btn l s" data-go="back">← 취소</button></div>

  <div class="sec"><h2>기본 정보</h2>
    <div class="row"><input type="text" id="f_bed" placeholder="베드/구역 (예: 3, A-2)" style="flex:.8"><input type="text" id="f_name" placeholder="이름 (예: 홍○○)"></div>
    <div class="row"><input type="number" id="f_age" placeholder="나이" inputmode="numeric" style="flex:.7">
      <div class="chips" data-k="sex" data-one><button class="chip" data-v="M">남</button><button class="chip" data-v="F">여</button></div></div>
  </div>

  <div class="sec"><h2>보호자</h2>
    <div class="chips" data-k="gHas" data-one><button class="chip" data-v="y">있음</button><button class="chip" data-v="n">없음</button></div>
    <div class="sub hide" id="gBox">
      <div id="gList"></div>
      <button class="btn l s" id="gAdd">＋ 보호자 추가</button>
    </div>
  </div>

  <div class="sec"><h2>거동 · 욕창</h2>
    <div class="lab">거동</div>
    <div class="chips" data-k="mob" data-one>
      <button class="chip" data-v="독립보행">독립보행</button><button class="chip" data-v="부축거동">부축거동</button>
      <button class="chip" data-v="워커">워커</button><button class="chip" data-v="지팡이">지팡이</button>
      <button class="chip" data-v="휠체어">휠체어</button><button class="chip" data-v="침상(bedridden)">침상(bedridden)</button></div>
    <input type="text" id="f_mobNote" placeholder="거동 메모 (예: 낙상위험, 1인 부축)" style="margin-top:8px">
    <div class="lab" style="margin-top:14px">욕창</div>
    <div class="chips" data-k="soreHas" data-one><button class="chip" data-v="y">있음</button><button class="chip" data-v="n">없음</button></div>
    <div class="sub hide" id="sBox">
      <div id="sList"></div>
      <button class="btn l s" id="sAdd">＋ 욕창 부위 추가</button>
    </div>
  </div>

  <div class="sec"><h2>달고 있는 것</h2>
    <div class="lab" style="margin-top:4px">눌러서 추가 (같은 것 여러 개 가능)</div>
    <div id="devAdd" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    <div id="devList"></div>
  </div>

  <div class="sec"><h2>내원 경로</h2>
    <div class="chips" data-k="route" data-one>
      <button class="chip" data-v="직접">직접</button><button class="chip" data-v="진협">진협</button>
      <button class="chip" data-v="MOU">MOU</button><button class="chip" data-v="기타">기타</button></div>
    <div class="sub hide" id="rJin">
      <div class="chips" data-k="routeFrom" data-one><button class="chip" data-v="병원">병원에서</button><button class="chip" data-v="집">집에서</button></div>
      <input type="text" id="f_rJinTxt" placeholder="어느 병원 / 상세 (예: ○○병원 내과, 의뢰서 有)" style="margin-top:8px">
    </div>
    <div class="sub hide" id="rMou"><input type="text" id="f_rMouTxt" placeholder="어느 요양원 (예: ○○요양원)"></div>
    <div class="sub hide" id="rEtc"><input type="text" id="f_rEtcTxt" placeholder="상세 (예: 119, 외래 경유)"></div>
  </div>

  <div class="sec"><h2>과거력</h2>
    <div class="chips" data-k="pmh" id="pmhChips"></div>
    <textarea id="f_pmhTxt" placeholder="기타 과거력 / 수술력 / 복용약 등" style="margin-top:8px"></textarea>
  </div>

  <div class="sec"><h2>현재 증상</h2>
    <textarea id="f_cc" placeholder="증상 (예: 발열, 기침, 가래)"></textarea>
    <input type="text" id="f_onset" placeholder="언제부터 (예: 11/7 저녁부터, 3일 전)" style="margin-top:8px">
  </div>

  <div class="sec"><h2>검사 결과 (특이사항)</h2>
    <textarea id="f_lab" placeholder="예: WBC 15.2↑ CRP 12↑ / CXR Rt. LLL haziness / Cr 2.1"></textarea>
  </div>

  <div class="sec"><h2>기타</h2>
    <textarea id="f_etc" placeholder="자유 메모 (주의사항, 할 일, 인계 내용 등)"></textarea>
  </div>

  <div class="sticky">
    <button class="btn r hide" id="bDel" style="flex:.5">삭제</button>
    <button class="btn" id="bSave">저장</button>
  </div>
</section>
<div class="toast" id="toast"></div>
</main>
<script>
(()=>{
const KEY='nurse_pt_notes_v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const DT={
 foley:{n:'Foley',f:[['fr','Fr','num'],['date','삽입일','date'],['note','메모','w','교체 예정, 소변 양상 등']]},
 ltube:{n:'L-tube',f:[['fr','Fr','num'],['cm','고정 길이','num'],['date','삽입일','date'],['feed','피딩','w','예: 뉴케어 200cc tid, 30분 이상 천천히'],['note','메모','w','위치 확인, 잔류량 등']]},
 pcd:{n:'PCD',f:[['site','위치','w','예: Rt. 담낭, 간농양'],['fr','Fr','num'],['date','삽입일','date'],['dress','드레싱일','date'],['drain','배액','text','예: 갈색 50cc/d'],['note','메모','w','']]},
 dress:{n:'드레싱',f:[['site','부위','w','예: 천골, Lt. 하지 수술부위'],['how','방법/재료','text','예: 폼, 거즈'],['cycle','주기','text','예: q2d, 매일'],['date','마지막 드레싱','date'],['note','메모','w','']]},
 iv:{n:'IV line',f:[['site','부위','text','예: Rt. 전완'],['g','게이지','num'],['date','삽입일','date'],['note','메모','w','']]},
 cline:{n:'C-line/PICC',f:[['site','부위','text','예: Rt. IJV'],['date','삽입일','date'],['dress','드레싱일','date'],['note','메모','w','']]},
 o2:{n:'O₂',f:[['how','방법','text','예: NC, mask'],['l','양','num'],['note','메모','w','']]},
 trach:{n:'T-cannula',f:[['size','size','text'],['date','교체일','date'],['note','메모','w','']]},
 peg:{n:'PEG',f:[['fr','Fr','num'],['date','삽입일','date'],['feed','피딩','w','예: 그린비아 300cc tid'],['note','메모','w','']]},
 etc:{n:'기타',f:[['name','무엇','text','예: 장루, 배액관'],['date','삽입일','date'],['note','메모','w','']]},
};
const UNIT={fr:'Fr',g:'G',cm:'cm',l:'L'};
const md=v=>{const m=String(v).match(/^(\d{4})-(\d\d)-(\d\d)$/);return m?`${+m[2]}/${+m[3]}`:v};
const dday=v=>{const m=String(v).match(/^(\d{4})-(\d\d)-(\d\d)$/);if(!m)return '';const t=new Date();t.setHours(0,0,0,0);const n=Math.round((t-new Date(+m[1],m[2]-1,+m[3]))/864e5);return n>=0?`D+${n}`:''};
const dLabel=l=>({'삽입일':'삽입','드레싱일':'드레싱','마지막 드레싱':'최근 드레싱','교체일':'교체'})[l]||l;
const devDetail=x=>{const T=DT[x.t]||DT.etc;return T.f.map(([k,l,ty])=>{const v=(x[k]||'').trim();if(!v)return '';
  if(UNIT[k])return v+UNIT[k];
  if(ty==='date'){const d=dday(v);return `${dLabel(l)} ${md(v)}${d?`(${d})`:''}`}
  if(k==='feed')return '피딩: '+v; if(k==='drain')return '배액: '+v; return v}).filter(Boolean).join(' · ')};
const devName=x=>x.t==='etc'&&x.name?x.name:(DT[x.t]||DT.etc).n;
const PMH=['HTN','DM','Dyslipidemia','CVA','치매','파킨슨','CKD','HF','Afib','COPD','Cancer','결핵'];
const SECS=[['basic','기본 정보'],['guard','보호자'],['mob','거동 · 욕창'],['dev','달고 있는 것'],['route','내원 경로'],['pmh','과거력'],['cc','현재 증상'],['lab','검사 결과'],['etc','기타']];
const REL=['배우자','아들','딸','며느리','사위','손자녀','형제자매','기타'];
const SITE=['천골','미골','좌 둔부','우 둔부','좌 발뒤꿈치','우 발뒤꿈치','좌 대전자','우 대전자','기타'];
const STAGE=['1단계','2단계','3단계','4단계','미분류','DTI'];

let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}
data.forEach(p=>{if(p.devs&&!p.lines){p.lines=Object.entries(p.devs).map(([k,d])=>({t:DT[k]?k:'etc',note:(d&&d.note)||''}));delete p.devs}if(!p.lines)p.lines=[]});
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('⚠️ 저장 실패 (브라우저 저장소 사용 불가)');return false}};
let cur=null, prevView='list';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600)}
function show(v){['vList','vView','vEditF'].forEach(id=>$('#'+id).classList.toggle('hide',id!==v));scrollTo(0,0)}

/* ---------- chips ---------- */
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  const g=c.parentElement;if(!g.classList.contains('chips'))return;
  e.preventDefault();
  if(g.hasAttribute('data-one')){const was=c.classList.contains('on');g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));if(!was)c.classList.add('on')}
  else c.classList.toggle('on');
  g.dispatchEvent(new Event('chg',{bubbles:true}));
});
const getChip=k=>{const g=$(`.chips[data-k="${k}"]`);const on=[...g.querySelectorAll('.chip.on')].map(x=>x.dataset.v);return g.hasAttribute('data-one')?(on[0]||''):on};
const setChip=(k,v)=>{const g=$(`.chips[data-k="${k}"]`);const arr=Array.isArray(v)?v:[v];g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',arr.includes(x.dataset.v)));g.dispatchEvent(new Event('chg',{bubbles:true}))};

/* static builds */
$('#pmhChips').innerHTML=PMH.map(p=>`<button class="chip" data-v="${p}">${p}</button>`).join('');
$('#devAdd').innerHTML=Object.entries(DT).map(([k,t])=>`<button type="button" class="addb" data-t="${k}">＋ ${t.n}</button>`).join('');
$('#devAdd').onclick=e=>{const b=e.target.closest('.addb');if(b){const d=addDev({t:b.dataset.t});d.scrollIntoView({block:'center',behavior:'smooth'});const i=d.querySelector('input');i&&i.focus({preventScroll:true})}};

document.addEventListener('chg',e=>{
  const k=e.target.dataset.k;
  if(k==='gHas'){$('#gBox').classList.toggle('hide',getChip('gHas')!=='y');if(getChip('gHas')==='y'&&!$('#gList').children.length)addG()}
  if(k==='soreHas'){$('#sBox').classList.toggle('hide',getChip('soreHas')!=='y');if(getChip('soreHas')==='y'&&!$('#sList').children.length)addS()}
  if(k==='route'){const r=getChip('route');$('#rJin').classList.toggle('hide',r!=='진협');$('#rMou').classList.toggle('hide',r!=='MOU');$('#rEtc').classList.toggle('hide',r!=='기타')}
});

/* guardian / sore rows */
function addG(v={}){
  const d=document.createElement('div');d.className='item g';
  d.innerHTML=`<div class="row" style="margin:0 0 6px"><select class="rel">${REL.map(r=>`<option${r===v.rel?' selected':''}>${r}</option>`).join('')}</select>
  <select class="stay">${['','상주','비상주','연락만'].map(r=>`<option value="${r}"${r===(v.stay||'')?' selected':''}>${r||'상주 여부'}</option>`).join('')}</select><button class="x" type="button">✕</button></div>
  <div class="row" style="margin:0"><input type="tel" class="tel" placeholder="연락처" value="${esc(v.tel)}"><input type="text" class="gn" placeholder="메모 (예: 주보호자, 결정권자)" value="${esc(v.note)}"></div>`;
  d.querySelector('.x').onclick=()=>d.remove();$('#gList').appendChild(d);
}
function addS(v={}){
  const d=document.createElement('div');d.className='item s';
  d.innerHTML=`<div class="row" style="margin:0 0 6px"><select class="site">${SITE.map(r=>`<option${r===v.site?' selected':''}>${r}</option>`).join('')}</select>
  <select class="stage">${STAGE.map(r=>`<option${r===v.stage?' selected':''}>${r}</option>`).join('')}</select><button class="x" type="button">✕</button></div>
  <input type="text" class="sn" placeholder="크기·상태·드레싱 (예: 3x2cm, 폼드레싱 q2d)" value="${esc(v.note)}">`;
  d.querySelector('.x').onclick=()=>d.remove();$('#sList').appendChild(d);
}
function addDev(v){
  const T=DT[v.t]||DT.etc;const d=document.createElement('div');d.className='dv';d.dataset.t=DT[v.t]?v.t:'etc';
  d.innerHTML=`<div class="dh"><b>${T.n}</b><button class="x" type="button" style="background:none;border:0;color:#B33;font-weight:700">✕ 삭제</button></div><div class="fg">`+
    T.f.map(([k,l,ty,ph])=>{const val=esc(v[k]||'');
      if(ty==='date')return `<label>${l}<input type="date" data-f="${k}" value="${val}"></label>`;
      if(ty==='num')return `<label>${l}<span class="unit" style="display:block"><input type="text" inputmode="decimal" data-f="${k}" value="${val}"><span>${UNIT[k]||''}</span></span></label>`;
      return `<label class="${ty==='w'?'w':''}">${l}<input type="text" data-f="${k}" placeholder="${esc(ph||'')}" value="${val}"></label>`}).join('')+'</div>';
  d.querySelector('.x').onclick=()=>{if([...d.querySelectorAll('[data-f]')].some(i=>i.value.trim())&&!confirm(T.n+' 항목을 삭제할까요?'))return;d.remove()};
  $('#devList').appendChild(d);return d;
}
$('#gAdd').onclick=()=>addG();$('#sAdd').onclick=()=>addS();

/* ---------- form <-> data ---------- */
const blank=()=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),bed:'',name:'',age:'',sex:'',
  gHas:'',guards:[],mob:'',mobNote:'',soreHas:'',sores:[],lines:[],route:'',routeFrom:'',routeTxt:'',
  pmh:[],pmhTxt:'',cc:'',onset:'',lab:'',etc:'',memos:{},upd:0});

function fill(p){
  $('#f_bed').value=p.bed;$('#f_name').value=p.name;$('#f_age').value=p.age;setChip('sex',p.sex);
  $('#gList').innerHTML='';(p.guards||[]).forEach(addG);setChip('gHas',p.gHas);
  setChip('mob',p.mob);$('#f_mobNote').value=p.mobNote||'';
  $('#sList').innerHTML='';(p.sores||[]).forEach(addS);setChip('soreHas',p.soreHas);
  $('#devList').innerHTML='';(p.lines||[]).forEach(addDev);
  setChip('route',p.route);setChip('routeFrom',p.routeFrom||'');
  ['#f_rJinTxt','#f_rMouTxt','#f_rEtcTxt'].forEach(s=>$(s).value='');
  if(p.route==='진협')$('#f_rJinTxt').value=p.routeTxt;if(p.route==='MOU')$('#f_rMouTxt').value=p.routeTxt;if(p.route==='기타')$('#f_rEtcTxt').value=p.routeTxt;
  setChip('pmh',p.pmh||[]);$('#f_pmhTxt').value=p.pmhTxt||'';
  fillMemos(p);$('#f_cc').value=p.cc;$('#f_onset').value=p.onset;$('#f_lab').value=p.lab;$('#f_etc').value=p.etc;
}
function collect(p){
  const v=s=>$(s).value.trim();
  Object.assign(p,{bed:v('#f_bed'),name:v('#f_name'),age:v('#f_age'),sex:getChip('sex'),
    gHas:getChip('gHas'),guards:getChip('gHas')==='y'?$$('#gList .g').map(d=>({rel:d.querySelector('.rel').value,stay:d.querySelector('.stay').value,tel:d.querySelector('.tel').value.trim(),note:d.querySelector('.gn').value.trim()})):[],
    mob:getChip('mob'),mobNote:v('#f_mobNote'),
    soreHas:getChip('soreHas'),sores:getChip('soreHas')==='y'?$$('#sList .s').map(d=>({site:d.querySelector('.site').value,stage:d.querySelector('.stage').value,note:d.querySelector('.sn').value.trim()})):[],
    lines:$$('#devList .dv').map(d=>{const o={t:d.dataset.t};d.querySelectorAll('[data-f]').forEach(i=>{if(i.value.trim())o[i.dataset.f]=i.value.trim()});return o}),
    route:getChip('route'),routeFrom:getChip('route')==='진협'?getChip('routeFrom'):'',
    routeTxt:({'진협':v('#f_rJinTxt'),'MOU':v('#f_rMouTxt'),'기타':v('#f_rEtcTxt')})[getChip('route')]||'',
    pmh:getChip('pmh'),pmhTxt:v('#f_pmhTxt'),cc:v('#f_cc'),onset:v('#f_onset'),lab:v('#f_lab'),etc:v('#f_etc'),memos:Object.fromEntries(SECS.map(([k])=>[k,$('#m_'+k).value.trim()]).filter(x=>x[1])),upd:Date.now()});
  return p;
}

/* ---------- text helpers ---------- */
const fmt={
  head:p=>[p.bed?`[${p.bed}]`:'',p.name||'(이름 없음)',[p.age,{M:'M',F:'F'}[p.sex]].filter(Boolean).join('/')].filter(Boolean).join(' '),
  guard:p=>p.gHas==='n'?'없음':p.gHas==='y'?(p.guards.length?p.guards.map(g=>{const x=[g.stay,g.tel,g.note].filter(Boolean).join(' · ');return g.rel+(x?` (${x})`:'')}).join(', '):'있음'):'',
  mob:p=>[p.mob,p.mobNote].filter(Boolean).join(' - '),
  sore:p=>p.soreHas==='n'?'없음':p.soreHas==='y'?(p.sores.length?p.sores.map(s=>`${s.site} ${s.stage}${s.note?` (${s.note})`:''}`).join(' / '):'있음'):'',
  route:p=>!p.route?'':p.route==='진협'?['진협',p.routeFrom&&(p.routeFrom+'에서'),p.routeTxt].filter(Boolean).join(' - '):[p.route,p.routeTxt].filter(Boolean).join(' - '),
  pmh:p=>[(p.pmh||[]).join(', '),p.pmhTxt].filter(Boolean).join(' / '),
  cc:p=>[p.cc,p.onset&&`(${p.onset}~)`].filter(Boolean).join(' '),
};
const ROWS=[['보호자',fmt.guard,'guard'],['거동',fmt.mob,'mob'],['욕창',fmt.sore,'mob'],['내원 경로',fmt.route,'route'],['과거력',fmt.pmh,'pmh'],['현재 증상',fmt.cc,'cc'],['검사',p=>p.lab,'lab'],['기타',p=>p.etc,'etc']];
const memo=(p,k)=>((p.memos||{})[k]||'').trim();
const memoLine=(p,k)=>memo(p,k)?'  📌 '+memo(p,k).replace(/\n/g,'\n     '):'';
const rowsFor=(p,k)=>k==='dev'?((p.lines||[]).length?p.lines.map(x=>[devName(x),devDetail(x)]):[['라인 등','']]):ROWS.filter(r=>r[2]===k).map(([n,f])=>[n,f(p)]);
const toText=p=>{
  const out=[fmt.head(p),memoLine(p,'basic')];
  SECS.slice(1).forEach(([k])=>{const rs=rowsFor(p,k);
    if(k==='dev'&&p.lines.length)out.push('라인 등:',...p.lines.map(x=>`- ${devName(x)}${devDetail(x)?' '+devDetail(x):''}`));
    else if(k!=='dev')rs.forEach(([n,t])=>{if(t)out.push(`${n}: ${t}`)});
    if(memo(p,k))out.push((rs.some(r=>r[1])||(k==='dev'&&p.lines.length)?'':SECS.find(s=>s[0]===k)[1]+':')+memoLine(p,k))});
  return out.filter(Boolean).join('\n')};

/* ---------- render ---------- */
const bedKey=b=>{const m=String(b).match(/\d+/);return [m?+m[0]:1e9,String(b)]};
function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const arr=data.filter(p=>!q||toText(p).toLowerCase().includes(q))
    .sort((a,b)=>{const x=bedKey(a.bed),y=bedKey(b.bed);return x[0]-y[0]||x[1].localeCompare(y[1])});
  const L=$('#list');
  if(!data.length){L.innerHTML='<div class="empty">아직 등록된 환자가 없어요.<br>아래 <b>＋ 환자 추가</b>를 눌러 시작하세요.</div>';return}
  if(!arr.length){L.innerHTML='<div class="empty">검색 결과가 없어요.</div>';return}
  L.innerHTML=arr.map(p=>{
    const tags=[];
    if(p.mob)tags.push(`<span class="tag b">${esc(p.mob)}</span>`);
    if(p.soreHas==='y')tags.push(`<span class="tag w">욕창 ${p.sores.length?esc(p.sores.map(s=>s.site).join('·')):''}</span>`);
    (p.lines||[]).forEach(x=>tags.push(`<span class="tag w">${esc(devName(x)+(x.fr?' '+x.fr+'Fr':''))}</span>`));
    if(p.gHas==='y')tags.push(`<span class="tag g">보호자 ${esc(p.guards.map(g=>g.rel).join('·'))}</span>`);
    if(p.gHas==='n')tags.push(`<span class="tag">보호자 없음</span>`);
    if(p.route)tags.push(`<span class="tag">${esc(p.route)}</span>`);
    if(Object.values(p.memos||{}).some(Boolean))tags.push(`<span class="tag" style="background:#FFF3A3;color:#7A6A10">📌 메모 ${Object.values(p.memos).filter(Boolean).length}</span>`);
    return `<div class="pt" data-id="${p.id}"><div class="top">${p.bed?`<span class="bed">${esc(p.bed)}</span>`:''}<span class="nm">${esc(p.name||'(이름 없음)')}</span>
      <span class="as">${esc([p.age,{M:'남',F:'여'}[p.sex]].filter(Boolean).join(' / '))}</span></div>
      ${tags.length?`<div class="tags">${tags.join('')}</div>`:''}${p.cc?`<div class="cc">🩺 ${esc(fmt.cc(p))}</div>`:''}</div>`}).join('');
}
function renderView(p){
  const S=$('#sum');S.innerHTML='';S.className='';
  SECS.forEach(([k,title])=>{
    const sec=document.createElement('div');sec.className='sec';
    if(k==='basic')sec.innerHTML=`<div class="vhead">${esc(fmt.head(p))}</div><div class="upd" style="text-align:left;margin-top:4px">마지막 수정 ${new Date(p.upd).toLocaleString('ko-KR')}</div>`;
    else{const rs=rowsFor(p,k);
      if(!rs.some(r=>r[1])&&!memo(p,k)){sec.classList.add('esec');sec.innerHTML=`<h2>${title}</h2><span class="et">미입력 · 눌러서 입력</span>`;sec.onclick=e=>{if(!e.target.closest('.mbtn'))openEdit(p,false)}}
      else sec.innerHTML=`<h2>${title}</h2><dl class="${k==='dev'?'lines':''}">`+rs.map(([n,t])=>`<dt>${esc(n)}</dt><dd>${t?esc(t):'<span style="color:#bbb">-</span>'}</dd>`).join('')+'</dl>';}
    S.appendChild(sec);
    const ta=attachMemo(sec,k);ta.value=memo(p,k);ta._sync();
    ta.addEventListener('input',()=>{p.memos=p.memos||{};const v=ta.value.trim();if(v)p.memos[k]=v;else delete p.memos[k];clearTimeout(ta._t);ta._t=setTimeout(persist,300)});
  });
}

/* ---------- post-it memo ---------- */
function attachMemo(sec,key){
  const w=document.createElement('div');w.className='secwrap';sec.replaceWith(w);w.appendChild(sec);
  const b=document.createElement('button');b.type='button';b.className='mbtn';b.textContent='📌 메모';sec.appendChild(b);
  const pi=document.createElement('div');pi.className='postit hide';
  pi.innerHTML='<div class="ph"><span>📌 메모</span><button type="button" class="px" title="메모 지우기">✕</button></div><textarea placeholder="여기에 메모..."></textarea>';
  w.appendChild(pi);
  const ta=pi.querySelector('textarea');
  ta._sync=()=>{const has=!!ta.value.trim();pi.classList.toggle('hide',!has);b.classList.toggle('has',has)};
  ta.addEventListener('input',()=>b.classList.toggle('has',!!ta.value.trim()));
  b.onclick=()=>{pi.classList.remove('hide');ta.focus()};
  pi.querySelector('.px').onclick=()=>{if(ta.value.trim()&&!confirm('이 메모를 지울까요?'))return;ta.value='';ta.dispatchEvent(new Event('input'));pi.classList.add('hide')};
  return ta;
}
$$('#vEditF .sec').forEach((sec,i)=>{const ta=attachMemo(sec,SECS[i][0]);ta.id='m_'+SECS[i][0]});
function fillMemos(p){SECS.forEach(([k])=>{const ta=$('#m_'+k);ta.value=memo(p,k);ta._sync()})}

/* ---------- actions ---------- */
function openView(id){cur=data.find(p=>p.id===id);if(!cur)return;renderView(cur);show('vView')}
function openEdit(p,isNew){cur=p;fill(p);$('#bDel').classList.toggle('hide',!!isNew);prevView=isNew?'list':'view';show('vEditF');if(isNew)$('#f_bed').focus()}
$('#list').onclick=e=>{const c=e.target.closest('.pt');if(c)openView(c.dataset.id)};
$('#bAdd').onclick=()=>openEdit(blank(),true);
$('#vEdit').onclick=()=>openEdit(cur,false);
$$('[data-go]').forEach(b=>b.onclick=()=>{
  if(b.dataset.go==='back'&&prevView==='view'&&data.includes(cur)){renderView(cur);show('vView')}else{renderList();show('vList')}
});
$('#bSave').onclick=()=>{
  collect(cur);
  if(!cur.name&&!cur.bed){toast('베드나 이름 중 하나는 적어주세요');return}
  if(!data.includes(cur))data.push(cur);
  if(persist())toast('저장했어요');renderView(cur);show('vView');
};
$('#bDel').onclick=()=>{if(!confirm(`${fmt.head(cur)} 환자를 삭제할까요?`))return;data=data.filter(p=>p!==cur);persist();renderList();show('vList');toast('삭제했어요')};
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('복사했어요')}
$('#vCopy').onclick=()=>copy(toText(cur));
$('#bCopyAll').onclick=()=>{if(!data.length)return toast('환자가 없어요');copy([...data].sort((a,b)=>bedKey(a.bed)[0]-bedKey(b.bed)[0]).map(toText).join('\n\n'))};
$('#q').oninput=renderList;
$('#bWipe').onclick=()=>{if(!data.length)return;if(!confirm('모든 환자 기록을 삭제할까요?\n(근무 끝나면 정리용)'))return;data=[];persist();renderList();toast('전체 삭제했어요')};
$('#bExport').onclick=()=>{
  const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='환자노트_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#bImport').onclick=()=>$('#fImport').click();
$('#fImport').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;
    const ids=new Set(data.map(p=>p.id));let n=0;
    arr.forEach(p=>{if(p&&p.id&&!ids.has(p.id)){data.push(Object.assign(blank(),p));n++}});
    persist();renderList();toast(`${n}명 불러왔어요`)}catch(err){toast('⚠️ 올바른 백업 파일이 아니에요')}
};
renderList();
})();
</script></body></html>
