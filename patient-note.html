<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>환자 파악 노트</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css");
*{box-sizing:border-box}
:root{--bg:#F3F5F8;--card:#fff;--line:#E2E6EB;--line2:#D3D9E0;--ink:#18212D;--sub:#667180;--mute:#98A1AD;
  --brand:#0E7C72;--brand-d:#0A5F57;--brand-l:#E5F4F2;--warn:#B4480F;--warn-l:#FDEBDD;--blue:#2353B8;--blue-l:#E4ECFB;--green:#1B7A3A;--green-l:#DFF3E5;--red:#C2362F;--top:60px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;letter-spacing:-.01em;word-break:keep-all}
button{font:inherit;cursor:pointer}
.hide{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;height:var(--top);background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.08rem;letter-spacing:-.03em;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:1.05rem;font-weight:900}
.tdate{color:var(--sub);font-size:.88rem;font-weight:600;padding-left:14px;margin-left:4px;border-left:1px solid var(--line)}
.sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-weight:700;font-size:.9rem;white-space:nowrap}
.tbtn:hover{background:#F6F8FA}
.tbtn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.tbtn.pri:hover{background:var(--brand-d)}
.ibtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-weight:800;font-size:1.05rem;display:grid;place-items:center}
.menu{position:relative}
.dd{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(16,24,40,.14);padding:6px;min-width:190px}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font-weight:600;font-size:.92rem;color:var(--ink)}
.dd button:hover{background:#F3F5F8}
.dd .danger{color:var(--red)}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
#tBack{display:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - var(--top))}
#side{background:var(--card);border-right:1px solid var(--line);position:sticky;top:var(--top);height:calc(100vh - var(--top));display:flex;flex-direction:column}
.sidehead{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{padding-left:36px!important;background:#F6F8FA!important}
.search::before{content:"";position:absolute;left:12px;top:50%;width:13px;height:13px;margin-top:-8px;border:2px solid var(--mute);border-radius:50%}
.search::after{content:"";position:absolute;left:24px;top:50%;width:6px;height:2px;margin-top:5px;background:var(--mute);transform:rotate(45deg)}
.cnt{display:flex;justify-content:space-between;font-size:.8rem;color:var(--sub);font-weight:600;margin-top:10px}
.cnt b{color:var(--brand)}
#list{flex:1;overflow:auto}
.priv{font-size:.74rem;color:var(--mute);padding:10px 16px 14px;border-top:1px solid var(--line);line-height:1.5}
#main{padding:24px 28px 110px;min-width:0}
.wrap{max-width:1040px;margin:0 auto}

/* ---------- patient list ---------- */
.pt{padding:13px 16px 12px 14px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
.pt:hover{background:#F7F9FA}
.pt.sel{background:var(--brand-l);border-left-color:var(--brand)}
.pt .top{display:flex;align-items:center;gap:9px}
.bed{min-width:30px;height:24px;padding:0 7px;border-radius:7px;background:var(--ink);color:#fff;font-weight:800;font-size:.8rem;display:inline-grid;place-items:center;flex:none}
.pt.sel .bed{background:var(--brand)}
.pt .nm{font-weight:700;font-size:.98rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .as{color:var(--sub);font-size:.82rem;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;background:#EEF1F4;color:#4E5966}
.tag.w{background:var(--warn-l);color:var(--warn)}
.tag.b{background:var(--blue-l);color:var(--blue)}
.tag.g{background:var(--green-l);color:var(--green)}
.tag.m{background:#FFF3A3;color:#7A6A10}
.pt .cc{font-size:.82rem;color:var(--sub);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:28px 18px;text-align:center;color:var(--sub);font-size:.9rem}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:700;font-size:.92rem}
.btn:hover{background:var(--brand-d)}
.btn.l{background:#fff;color:var(--ink);border-color:var(--line2)}
.btn.l:hover{background:#F6F8FA}
.btn.r{background:#fff;color:var(--red);border-color:#EBC5C2}
.btn.s{height:32px;padding:0 11px;font-size:.84rem}
input[type=text],input[type=number],input[type=tel],input[type=date],textarea,select{font:inherit;font-size:.93rem;width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,124,114,.14)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:.9rem;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---------- page header (view / edit) ---------- */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:38px}
.crumb .path{font-size:.86rem;color:var(--sub);font-weight:600;flex:1}
.crumb .path b{color:var(--ink)}
.crumb .acts{display:flex;gap:8px}

/* ---------- sections ---------- */
.sec{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.sec h2{font-size:.98rem;font-weight:800;margin:0 0 14px;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.sec h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brand)}
.secwrap>.sec{margin-bottom:14px}
.row{display:flex;gap:8px;margin-bottom:9px;align-items:center}
.row>*{flex:1}
.lab{font-size:.8rem;font-weight:700;color:var(--sub);margin:12px 0 6px}
.lab:first-of-type{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d);font-weight:800}
.sub{background:#F7F9FA;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.item .x{background:none;border:0;color:var(--red);font-weight:700;font-size:.85rem;padding:4px 2px;flex:none}
.basic{display:grid;grid-template-columns:1fr 2fr 1fr auto;gap:10px;align-items:end}
.basic label,.fl{font-size:.78rem;font-weight:700;color:var(--sub);display:block}
.basic input{margin-top:4px}
.sticky{position:sticky;bottom:0;margin:6px -28px 0;padding:12px 28px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;z-index:5}
.sticky .btn{height:42px;padding:0 26px}

/* devices */
.addb{border:1px dashed var(--line2);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700}
.addb:hover{border-color:var(--brand);color:var(--brand)}
.dv{background:#fff;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:11px 12px;margin-top:10px}
.dv .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dv .dh b{font-size:.92rem;color:var(--warn)}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px}
.fg label{display:block;font-size:.76rem;font-weight:700;color:var(--sub)}
.fg label.w{grid-column:span 2}
.fg input{margin-top:3px;padding:7px 9px;width:100%;display:block;min-height:38px}
.unit{position:relative}.unit input{padding-right:34px}.unit span{position:absolute;right:10px;bottom:9px;font-size:.8rem;color:var(--sub);font-weight:700}

/* view */
.phead{display:flex;gap:16px;align-items:center}
.phead .bigbed{width:58px;height:58px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.25rem;flex:none}
.phead .pn{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.phead .pm{color:var(--sub);font-weight:600;font-size:.92rem;margin-left:6px}
.phead .upd{font-size:.76rem;color:var(--mute);margin-top:6px}
#vView .sec dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:9px 14px}
#vView .sec dt{font-size:.82rem;font-weight:700;color:var(--sub);padding-top:2px}
#vView .sec dd{margin:0;font-size:.95rem;white-space:pre-wrap}
.pill{display:inline-block;font-size:.82rem;font-weight:600;background:#F1F3F6;border-radius:6px;padding:2px 8px;margin:0 4px 4px 0}
.pill.dd2{background:var(--blue-l);color:var(--blue);font-weight:800}
#vView .sec.esec{background:transparent;box-shadow:none;border:1px dashed var(--line2);padding:11px 20px;cursor:pointer}
#vView .sec.esec:hover{background:#fff}
#vView .sec.esec h2{margin:0;color:var(--mute);display:inline-flex}
#vView .sec.esec h2::before{background:var(--line2)}
#vView .sec.esec .et{font-size:.8rem;color:var(--mute);font-weight:600;margin-left:6px}
.welcome{text-align:center;padding:90px 20px;color:var(--sub)}
.welcome .ic{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;font-size:2rem;font-weight:900}
.welcome h3{color:var(--ink);font-size:1.2rem;margin:0 0 6px}
.welcome p{margin:0 0 20px;font-size:.92rem}

/* post-it memo */
.mbtn{position:absolute;top:14px;right:14px;background:#FFF6BF;border:1px solid #EADB86;color:#7A6A10;border-radius:7px;padding:3px 9px;font-size:.78rem;font-weight:700}
.mbtn:hover,.mbtn.has{background:#FFE45C;border-color:#D9C24A}
.postit{background:#FFF3A3;border-radius:2px 2px 14px 2px;box-shadow:2px 5px 12px rgba(0,0,0,.12);padding:9px 11px 6px;margin:-4px 10px 18px;transform:rotate(-.6deg)}
.postit .ph{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;font-weight:800;color:#7A6A10}
.postit .px{background:none;border:0;color:#9A8420;font-weight:800;padding:2px 4px}
.postit textarea{background:transparent!important;border:0;box-shadow:none!important;padding:4px 2px;min-height:80px;font-size:.92rem;line-height:1.55;color:#3D3510}

@media (min-width:1180px){
  .secwrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:start}
  .postit{margin:6px 0 14px;transform:rotate(1.2deg)}
  .secwrap:nth-child(even) .postit{transform:rotate(-1deg)}
}
@media (min-width:900px){
  body[data-view=list] #vEmpty{display:block}
}
@media (max-width:899px){
  :root{--top:56px}
  .topbar{padding:0 12px;gap:8px}
  .tdate,.tlabel{display:none}
  .brand{font-size:1rem}
  .app{display:block}
  #side{position:static;height:auto;border-right:0}
  #list{overflow:visible}
  body[data-view=list] #main{display:none}
  body:not([data-view=list]) #side{display:none}
  body:not([data-view=list]) #tBack{display:grid}
  body:not([data-view=list]) .brand .logo{display:none}
  #main{padding:14px 12px 100px}
  .crumb .path{display:none}
  .crumb .acts{flex:1;justify-content:flex-end}
  .sec{padding:15px 15px}
  .basic{grid-template-columns:1fr 1fr}
  .fg{grid-template-columns:1fr 1fr}
  .sticky{margin:6px -12px 0;padding:10px 12px}
  .sticky .btn{flex:1}
  #vView .sec dl{grid-template-columns:72px 1fr}
}
</style></head><body data-view="list">

<header class="topbar">
  <button class="ibtn" id="tBack" title="뒤로">←</button>
  <div class="brand"><span class="logo">✚</span>환자 파악 노트</div>
  <div class="tdate" id="tdate"></div>
  <span class="sp"></span>
  <button class="tbtn" id="bCopyAll" title="전체 인계 텍스트 복사">📋<span class="tlabel">전체 인계 복사</span></button>
  <button class="tbtn pri" id="bAdd">＋<span class="tlabel">환자 추가</span></button>
  <div class="menu"><button class="ibtn" id="bMenu" title="더보기">⋯</button>
    <div class="dd hide" id="dd">
      <button id="bExport">💾 백업 파일 저장</button>
      <button id="bImport">📂 백업 불러오기</button>
      <hr><button id="bWipe" class="danger">🗑 전체 삭제</button>
    </div>
  </div>
  <input type="file" id="fImport" accept=".json,application/json" class="hide">
</header>

<div class="app">
<aside id="side">
  <div class="sidehead">
    <div class="search"><input type="text" id="q" placeholder="이름·베드·증상 검색"></div>
    <div class="cnt"><span>환자 목록</span><span>총 <b id="cnt">0</b>명</span></div>
  </div>
  <div id="list"></div>
  <div class="priv">🔒 입력 내용은 이 기기 브라우저에만 저장돼요 (서버 전송 없음). 이름은 홍○○처럼 줄여 쓰는 걸 권장해요.</div>
</aside>

<main id="main"><div class="wrap">

<section id="vEmpty" class="hide">
  <div class="welcome"><div class="ic">✚</div><h3>환자를 선택하세요</h3>
    <p>왼쪽 목록에서 환자를 누르거나, 새 환자를 추가해 파악을 시작하세요.</p>
    <button class="btn" id="bAdd2">＋ 환자 추가</button></div>
</section>

<!-- ===== 상세 보기 ===== -->
<section id="vView" class="hide">
  <div class="crumb"><div class="path">환자 목록 › <b id="vPath"></b></div>
    <div class="acts"><button class="btn l s" id="vCopy">📋 복사</button><button class="btn s" id="vEdit">✎ 수정</button></div></div>
  <div id="sum"></div>
</section>

<!-- ===== 입력/수정 ===== -->
<section id="vEditF" class="hide">
  <div class="crumb"><div class="path">환자 목록 › <b id="eTitle">새 환자 등록</b></div>
    <div class="acts"><button class="btn l s" data-go="back">취소</button></div></div>

  <div class="sec"><h2>기본 정보</h2>
    <div class="basic">
      <label>베드/구역<input type="text" id="f_bed" placeholder="예: 3, A-2"></label>
      <label>이름<input type="text" id="f_name" placeholder="예: 홍○○"></label>
      <label>나이<input type="number" id="f_age" inputmode="numeric" placeholder="세"></label>
      <div><span class="fl" style="margin-bottom:4px">성별</span><div class="chips" data-k="sex" data-one><button class="chip" data-v="M">남</button><button class="chip" data-v="F">여</button></div></div>
    </div>
  </div>

  <div class="sec"><h2>보호자</h2>
    <div class="chips" data-k="gHas" data-one><button class="chip" data-v="y">있음</button><button class="chip" data-v="n">없음</button></div>
    <div class="sub hide" id="gBox">
      <div id="gList"></div>
      <button class="btn l s" id="gAdd">＋ 보호자 추가</button>
    </div>
  </div>

  <div class="sec"><h2>거동 · 욕창</h2>
    <div class="lab">거동</div>
    <div class="chips" data-k="mob" data-one>
      <button class="chip" data-v="독립보행">독립보행</button><button class="chip" data-v="부축거동">부축거동</button>
      <button class="chip" data-v="워커">워커</button><button class="chip" data-v="지팡이">지팡이</button>
      <button class="chip" data-v="휠체어">휠체어</button><button class="chip" data-v="침상(bedridden)">침상(bedridden)</button></div>
    <input type="text" id="f_mobNote" placeholder="거동 메모 (예: 낙상위험, 1인 부축)" style="margin-top:8px">
    <div class="lab" style="margin-top:14px">욕창</div>
    <div class="chips" data-k="soreHas" data-one><button class="chip" data-v="y">있음</button><button class="chip" data-v="n">없음</button></div>
    <div class="sub hide" id="sBox">
      <div id="sList"></div>
      <button class="btn l s" id="sAdd">＋ 욕창 부위 추가</button>
    </div>
  </div>

  <div class="sec"><h2>달고 있는 것</h2>
    <div class="lab" style="margin-top:4px">눌러서 추가 (같은 것 여러 개 가능)</div>
    <div id="devAdd" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    <div id="devList"></div>
  </div>

  <div class="sec"><h2>내원 경로</h2>
    <div class="chips" data-k="route" data-one>
      <button class="chip" data-v="직접">직접</button><button class="chip" data-v="진협">진협</button>
      <button class="chip" data-v="MOU">MOU</button><button class="chip" data-v="기타">기타</button></div>
    <div class="sub hide" id="rJin">
      <div class="chips" data-k="routeFrom" data-one><button class="chip" data-v="병원">병원에서</button><button class="chip" data-v="집">집에서</button></div>
      <input type="text" id="f_rJinTxt" placeholder="어느 병원 / 상세 (예: ○○병원 내과, 의뢰서 有)" style="margin-top:8px">
    </div>
    <div class="sub hide" id="rMou"><input type="text" id="f_rMouTxt" placeholder="어느 요양원 (예: ○○요양원)"></div>
    <div class="sub hide" id="rEtc"><input type="text" id="f_rEtcTxt" placeholder="상세 (예: 119, 외래 경유)"></div>
  </div>

  <div class="sec"><h2>과거력</h2>
    <div class="chips" data-k="pmh" id="pmhChips"></div>
    <textarea id="f_pmhTxt" placeholder="기타 과거력 / 수술력 / 복용약 등" style="margin-top:8px"></textarea>
  </div>

  <div class="sec"><h2>현재 증상</h2>
    <textarea id="f_cc" placeholder="증상 (예: 발열, 기침, 가래)"></textarea>
    <input type="text" id="f_onset" placeholder="언제부터 (예: 11/7 저녁부터, 3일 전)" style="margin-top:8px">
  </div>

  <div class="sec"><h2>검사 결과 (특이사항)</h2>
    <textarea id="f_lab" placeholder="예: WBC 15.2↑ CRP 12↑ / CXR Rt. LLL haziness / Cr 2.1"></textarea>
  </div>

  <div class="sec"><h2>기타</h2>
    <textarea id="f_etc" placeholder="자유 메모 (주의사항, 할 일, 인계 내용 등)"></textarea>
  </div>

  <div class="sticky">
    <button class="btn r hide" id="bDel">삭제</button><span style="flex:1"></span>
    <button class="btn l" data-go="back">취소</button>
    <button class="btn" id="bSave">저장</button>
  </div>
</section>
</div></main>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const KEY='nurse_pt_notes_v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const DT={
 foley:{n:'Foley',f:[['fr','Fr','num'],['date','삽입일','date'],['note','메모','w','교체 예정, 소변 양상 등']]},
 ltube:{n:'L-tube',f:[['fr','Fr','num'],['cm','고정 길이','num'],['date','삽입일','date'],['feed','피딩','w','예: 뉴케어 200cc tid, 30분 이상 천천히'],['note','메모','w','위치 확인, 잔류량 등']]},
 pcd:{n:'PCD',f:[['site','위치','w','예: Rt. 담낭, 간농양'],['fr','Fr','num'],['date','삽입일','date'],['dress','드레싱일','date'],['drain','배액','text','예: 갈색 50cc/d'],['note','메모','w','']]},
 dress:{n:'드레싱',f:[['site','부위','w','예: 천골, Lt. 하지 수술부위'],['how','방법/재료','text','예: 폼, 거즈'],['cycle','주기','text','예: q2d, 매일'],['date','마지막 드레싱','date'],['note','메모','w','']]},
 iv:{n:'IV line',f:[['site','부위','text','예: Rt. 전완'],['g','게이지','num'],['date','삽입일','date'],['note','메모','w','']]},
 cline:{n:'C-line/PICC',f:[['site','부위','text','예: Rt. IJV'],['date','삽입일','date'],['dress','드레싱일','date'],['note','메모','w','']]},
 o2:{n:'O₂',f:[['how','방법','text','예: NC, mask'],['l','양','num'],['note','메모','w','']]},
 trach:{n:'T-cannula',f:[['size','size','text'],['date','교체일','date'],['note','메모','w','']]},
 peg:{n:'PEG',f:[['fr','Fr','num'],['date','삽입일','date'],['feed','피딩','w','예: 그린비아 300cc tid'],['note','메모','w','']]},
 etc:{n:'기타',f:[['name','무엇','text','예: 장루, 배액관'],['date','삽입일','date'],['note','메모','w','']]},
};
const UNIT={fr:'Fr',g:'G',cm:'cm',l:'L'};
const md=v=>{const m=String(v).match(/^(\d{4})-(\d\d)-(\d\d)$/);return m?`${+m[2]}/${+m[3]}`:v};
const dday=v=>{const m=String(v).match(/^(\d{4})-(\d\d)-(\d\d)$/);if(!m)return '';const t=new Date();t.setHours(0,0,0,0);const n=Math.round((t-new Date(+m[1],m[2]-1,+m[3]))/864e5);return n>=0?`D+${n}`:''};
const dLabel=l=>({'삽입일':'삽입','드레싱일':'드레싱','마지막 드레싱':'최근 드레싱','교체일':'교체'})[l]||l;
const devDetail=x=>{const T=DT[x.t]||DT.etc;return T.f.map(([k,l,ty])=>{const v=(x[k]||'').trim();if(!v)return '';
  if(UNIT[k])return v+UNIT[k];
  if(ty==='date'){const d=dday(v);return `${dLabel(l)} ${md(v)}${d?`(${d})`:''}`}
  if(k==='feed')return '피딩: '+v; if(k==='drain')return '배액: '+v; return v}).filter(Boolean).join(' · ')};
const devName=x=>x.t==='etc'&&x.name?x.name:(DT[x.t]||DT.etc).n;
const PMH=['HTN','DM','Dyslipidemia','CVA','치매','파킨슨','CKD','HF','Afib','COPD','Cancer','결핵'];
const SECS=[['basic','기본 정보'],['guard','보호자'],['mob','거동 · 욕창'],['dev','달고 있는 것'],['route','내원 경로'],['pmh','과거력'],['cc','현재 증상'],['lab','검사 결과'],['etc','기타']];
const REL=['배우자','아들','딸','며느리','사위','손자녀','형제자매','기타'];
const SITE=['천골','미골','좌 둔부','우 둔부','좌 발뒤꿈치','우 발뒤꿈치','좌 대전자','우 대전자','기타'];
const STAGE=['1단계','2단계','3단계','4단계','미분류','DTI'];

let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}
data.forEach(p=>{if(p.devs&&!p.lines){p.lines=Object.entries(p.devs).map(([k,d])=>({t:DT[k]?k:'etc',note:(d&&d.note)||''}));delete p.devs}if(!p.lines)p.lines=[]});
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('⚠️ 저장 실패 (브라우저 저장소 사용 불가)');return false}};
let cur=null, prevView='list';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600)}
function show(v){
  document.body.dataset.view=v;
  const id={list:'vEmpty',view:'vView',edit:'vEditF'}[v];
  ['vEmpty','vView','vEditF'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));
  $('#vEmpty').classList.toggle('hide',v!=='list');
  renderList();scrollTo(0,0);
}
{const d=new Date();$('#tdate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`}

/* ---------- chips ---------- */
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  const g=c.parentElement;if(!g.classList.contains('chips'))return;
  e.preventDefault();
  if(g.hasAttribute('data-one')){const was=c.classList.contains('on');g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));if(!was)c.classList.add('on')}
  else c.classList.toggle('on');
  g.dispatchEvent(new Event('chg',{bubbles:true}));
});
const getChip=k=>{const g=$(`.chips[data-k="${k}"]`);const on=[...g.querySelectorAll('.chip.on')].map(x=>x.dataset.v);return g.hasAttribute('data-one')?(on[0]||''):on};
const setChip=(k,v)=>{const g=$(`.chips[data-k="${k}"]`);const arr=Array.isArray(v)?v:[v];g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',arr.includes(x.dataset.v)));g.dispatchEvent(new Event('chg',{bubbles:true}))};

/* static builds */
$('#pmhChips').innerHTML=PMH.map(p=>`<button class="chip" data-v="${p}">${p}</button>`).join('');
$('#devAdd').innerHTML=Object.entries(DT).map(([k,t])=>`<button type="button" class="addb" data-t="${k}">＋ ${t.n}</button>`).join('');
$('#devAdd').onclick=e=>{const b=e.target.closest('.addb');if(b){const d=addDev({t:b.dataset.t});d.scrollIntoView({block:'center',behavior:'smooth'});const i=d.querySelector('input');i&&i.focus({preventScroll:true})}};

document.addEventListener('chg',e=>{
  const k=e.target.dataset.k;
  if(k==='gHas'){$('#gBox').classList.toggle('hide',getChip('gHas')!=='y');if(getChip('gHas')==='y'&&!$('#gList').children.length)addG()}
  if(k==='soreHas'){$('#sBox').classList.toggle('hide',getChip('soreHas')!=='y');if(getChip('soreHas')==='y'&&!$('#sList').children.length)addS()}
  if(k==='route'){const r=getChip('route');$('#rJin').classList.toggle('hide',r!=='진협');$('#rMou').classList.toggle('hide',r!=='MOU');$('#rEtc').classList.toggle('hide',r!=='기타')}
});

/* guardian / sore rows */
function addG(v={}){
  const d=document.createElement('div');d.className='item g';
  d.innerHTML=`<div class="row" style="margin:0 0 6px"><select class="rel">${REL.map(r=>`<option${r===v.rel?' selected':''}>${r}</option>`).join('')}</select>
  <select class="stay">${['','상주','비상주','연락만'].map(r=>`<option value="${r}"${r===(v.stay||'')?' selected':''}>${r||'상주 여부'}</option>`).join('')}</select><button class="x" type="button">✕</button></div>
  <div class="row" style="margin:0"><input type="tel" class="tel" placeholder="연락처" value="${esc(v.tel)}"><input type="text" class="gn" placeholder="메모 (예: 주보호자, 결정권자)" value="${esc(v.note)}"></div>`;
  d.querySelector('.x').onclick=()=>d.remove();$('#gList').appendChild(d);
}
function addS(v={}){
  const d=document.createElement('div');d.className='item s';
  d.innerHTML=`<div class="row" style="margin:0 0 6px"><select class="site">${SITE.map(r=>`<option${r===v.site?' selected':''}>${r}</option>`).join('')}</select>
  <select class="stage">${STAGE.map(r=>`<option${r===v.stage?' selected':''}>${r}</option>`).join('')}</select><button class="x" type="button">✕</button></div>
  <input type="text" class="sn" placeholder="크기·상태·드레싱 (예: 3x2cm, 폼드레싱 q2d)" value="${esc(v.note)}">`;
  d.querySelector('.x').onclick=()=>d.remove();$('#sList').appendChild(d);
}
function addDev(v){
  const T=DT[v.t]||DT.etc;const d=document.createElement('div');d.className='dv';d.dataset.t=DT[v.t]?v.t:'etc';
  d.innerHTML=`<div class="dh"><b>${T.n}</b><button class="x" type="button" style="background:none;border:0;color:#B33;font-weight:700">✕ 삭제</button></div><div class="fg">`+
    T.f.map(([k,l,ty,ph])=>{const val=esc(v[k]||'');
      if(ty==='date')return `<label>${l}<input type="date" data-f="${k}" value="${val}"></label>`;
      if(ty==='num')return `<label>${l}<span class="unit" style="display:block"><input type="text" inputmode="decimal" data-f="${k}" value="${val}"><span>${UNIT[k]||''}</span></span></label>`;
      return `<label class="${ty==='w'?'w':''}">${l}<input type="text" data-f="${k}" placeholder="${esc(ph||'')}" value="${val}"></label>`}).join('')+'</div>';
  d.querySelector('.x').onclick=()=>{if([...d.querySelectorAll('[data-f]')].some(i=>i.value.trim())&&!confirm(T.n+' 항목을 삭제할까요?'))return;d.remove()};
  $('#devList').appendChild(d);return d;
}
$('#gAdd').onclick=()=>addG();$('#sAdd').onclick=()=>addS();

/* ---------- form <-> data ---------- */
const blank=()=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),bed:'',name:'',age:'',sex:'',
  gHas:'',guards:[],mob:'',mobNote:'',soreHas:'',sores:[],lines:[],route:'',routeFrom:'',routeTxt:'',
  pmh:[],pmhTxt:'',cc:'',onset:'',lab:'',etc:'',memos:{},upd:0});

function fill(p){
  $('#f_bed').value=p.bed;$('#f_name').value=p.name;$('#f_age').value=p.age;setChip('sex',p.sex);
  $('#gList').innerHTML='';(p.guards||[]).forEach(addG);setChip('gHas',p.gHas);
  setChip('mob',p.mob);$('#f_mobNote').value=p.mobNote||'';
  $('#sList').innerHTML='';(p.sores||[]).forEach(addS);setChip('soreHas',p.soreHas);
  $('#devList').innerHTML='';(p.lines||[]).forEach(addDev);
  setChip('route',p.route);setChip('routeFrom',p.routeFrom||'');
  ['#f_rJinTxt','#f_rMouTxt','#f_rEtcTxt'].forEach(s=>$(s).value='');
  if(p.route==='진협')$('#f_rJinTxt').value=p.routeTxt;if(p.route==='MOU')$('#f_rMouTxt').value=p.routeTxt;if(p.route==='기타')$('#f_rEtcTxt').value=p.routeTxt;
  setChip('pmh',p.pmh||[]);$('#f_pmhTxt').value=p.pmhTxt||'';
  fillMemos(p);$('#f_cc').value=p.cc;$('#f_onset').value=p.onset;$('#f_lab').value=p.lab;$('#f_etc').value=p.etc;
}
function collect(p){
  const v=s=>$(s).value.trim();
  Object.assign(p,{bed:v('#f_bed'),name:v('#f_name'),age:v('#f_age'),sex:getChip('sex'),
    gHas:getChip('gHas'),guards:getChip('gHas')==='y'?$$('#gList .g').map(d=>({rel:d.querySelector('.rel').value,stay:d.querySelector('.stay').value,tel:d.querySelector('.tel').value.trim(),note:d.querySelector('.gn').value.trim()})):[],
    mob:getChip('mob'),mobNote:v('#f_mobNote'),
    soreHas:getChip('soreHas'),sores:getChip('soreHas')==='y'?$$('#sList .s').map(d=>({site:d.querySelector('.site').value,stage:d.querySelector('.stage').value,note:d.querySelector('.sn').value.trim()})):[],
    lines:$$('#devList .dv').map(d=>{const o={t:d.dataset.t};d.querySelectorAll('[data-f]').forEach(i=>{if(i.value.trim())o[i.dataset.f]=i.value.trim()});return o}),
    route:getChip('route'),routeFrom:getChip('route')==='진협'?getChip('routeFrom'):'',
    routeTxt:({'진협':v('#f_rJinTxt'),'MOU':v('#f_rMouTxt'),'기타':v('#f_rEtcTxt')})[getChip('route')]||'',
    pmh:getChip('pmh'),pmhTxt:v('#f_pmhTxt'),cc:v('#f_cc'),onset:v('#f_onset'),lab:v('#f_lab'),etc:v('#f_etc'),memos:Object.fromEntries(SECS.map(([k])=>[k,$('#m_'+k).value.trim()]).filter(x=>x[1])),upd:Date.now()});
  return p;
}

/* ---------- text helpers ---------- */
const fmt={
  head:p=>[p.bed?`[${p.bed}]`:'',p.name||'(이름 없음)',[p.age,{M:'M',F:'F'}[p.sex]].filter(Boolean).join('/')].filter(Boolean).join(' '),
  guard:p=>p.gHas==='n'?'없음':p.gHas==='y'?(p.guards.length?p.guards.map(g=>{const x=[g.stay,g.tel,g.note].filter(Boolean).join(' · ');return g.rel+(x?` (${x})`:'')}).join(', '):'있음'):'',
  mob:p=>[p.mob,p.mobNote].filter(Boolean).join(' - '),
  sore:p=>p.soreHas==='n'?'없음':p.soreHas==='y'?(p.sores.length?p.sores.map(s=>`${s.site} ${s.stage}${s.note?` (${s.note})`:''}`).join(' / '):'있음'):'',
  route:p=>!p.route?'':p.route==='진협'?['진협',p.routeFrom&&(p.routeFrom+'에서'),p.routeTxt].filter(Boolean).join(' - '):[p.route,p.routeTxt].filter(Boolean).join(' - '),
  pmh:p=>[(p.pmh||[]).join(', '),p.pmhTxt].filter(Boolean).join(' / '),
  cc:p=>[p.cc,p.onset&&`(${p.onset}~)`].filter(Boolean).join(' '),
};
const ROWS=[['보호자',fmt.guard,'guard'],['거동',fmt.mob,'mob'],['욕창',fmt.sore,'mob'],['내원 경로',fmt.route,'route'],['과거력',fmt.pmh,'pmh'],['현재 증상',fmt.cc,'cc'],['검사',p=>p.lab,'lab'],['기타',p=>p.etc,'etc']];
const memo=(p,k)=>((p.memos||{})[k]||'').trim();
const memoLine=(p,k)=>memo(p,k)?'  📌 '+memo(p,k).replace(/\n/g,'\n     '):'';
const rowsFor=(p,k)=>k==='dev'?((p.lines||[]).length?p.lines.map(x=>[devName(x),devDetail(x)]):[['라인 등','']]):ROWS.filter(r=>r[2]===k).map(([n,f])=>[n,f(p)]);
const toText=p=>{
  const out=[fmt.head(p),memoLine(p,'basic')];
  SECS.slice(1).forEach(([k])=>{const rs=rowsFor(p,k);
    if(k==='dev'&&p.lines.length)out.push('라인 등:',...p.lines.map(x=>`- ${devName(x)}${devDetail(x)?' '+devDetail(x):''}`));
    else if(k!=='dev')rs.forEach(([n,t])=>{if(t)out.push(`${n}: ${t}`)});
    if(memo(p,k))out.push((rs.some(r=>r[1])||(k==='dev'&&p.lines.length)?'':SECS.find(s=>s[0]===k)[1]+':')+memoLine(p,k))});
  return out.filter(Boolean).join('\n')};

/* ---------- render ---------- */
const bedKey=b=>{const m=String(b).match(/\d+/);return [m?+m[0]:1e9,String(b)]};
function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const arr=data.filter(p=>!q||toText(p).toLowerCase().includes(q))
    .sort((a,b)=>{const x=bedKey(a.bed),y=bedKey(b.bed);return x[0]-y[0]||x[1].localeCompare(y[1])});
  const L=$('#list');$('#cnt').textContent=data.length;
  if(!data.length){L.innerHTML='<div class="empty">아직 등록된 환자가 없어요.<br>오른쪽 위 <b>＋ 환자 추가</b>를 눌러 시작하세요.</div>';return}
  if(!arr.length){L.innerHTML='<div class="empty">검색 결과가 없어요.</div>';return}
  L.innerHTML=arr.map(p=>{
    const tags=[];
    if(p.mob)tags.push(`<span class="tag b">${esc(p.mob)}</span>`);
    if(p.soreHas==='y')tags.push(`<span class="tag w">욕창 ${p.sores.length?esc(p.sores.map(s=>s.site).join('·')):''}</span>`);
    (p.lines||[]).forEach(x=>tags.push(`<span class="tag w">${esc(devName(x)+(x.fr?' '+x.fr+'Fr':''))}</span>`));
    if(p.gHas==='y')tags.push(`<span class="tag g">보호자 ${esc(p.guards.map(g=>g.rel).join('·'))}</span>`);
    if(p.gHas==='n')tags.push(`<span class="tag">보호자 없음</span>`);
    if(p.route)tags.push(`<span class="tag">${esc(p.route)}</span>`);
    if(Object.values(p.memos||{}).some(Boolean))tags.push(`<span class="tag m">📌 메모 ${Object.values(p.memos).filter(Boolean).length}</span>`);
    const sel=p===cur&&document.body.dataset.view!=='list';
    return `<div class="pt${sel?' sel':''}" data-id="${p.id}"><div class="top">${p.bed?`<span class="bed">${esc(p.bed)}</span>`:''}<span class="nm">${esc(p.name||'(이름 없음)')}</span>
      <span class="as">${esc([p.age,{M:'남',F:'여'}[p.sex]].filter(Boolean).join(' / '))}</span></div>
      ${tags.length?`<div class="tags">${tags.join('')}</div>`:''}${p.cc?`<div class="cc">${esc(fmt.cc(p))}</div>`:''}</div>`}).join('');
}
function renderView(p){
  const S=$('#sum');S.innerHTML='';S.className='';
  SECS.forEach(([k,title])=>{
    const sec=document.createElement('div');sec.className='sec';
    if(k==='basic'){const meta=[p.age&&p.age+'세',{M:'남',F:'여'}[p.sex]].filter(Boolean).join(' · ');
      sec.innerHTML=`<div class="phead"><div class="bigbed">${esc(p.bed||'-')}</div><div style="min-width:0;padding-right:70px"><div class="pn">${esc(p.name||'(이름 없음)')}<span class="pm">${esc(meta)}</span></div>
      <div class="upd">마지막 수정 ${new Date(p.upd).toLocaleString('ko-KR')}</div></div></div>`;}
    else{const rs=rowsFor(p,k);
      if(!rs.some(r=>r[1])&&!memo(p,k)){sec.classList.add('esec');sec.innerHTML=`<h2>${title}</h2><span class="et">미입력 · 눌러서 입력</span>`;sec.onclick=e=>{if(!e.target.closest('.mbtn'))openEdit(p,false)}}
      else sec.innerHTML=`<h2>${title}</h2><dl class="${k==='dev'?'lines':''}">`+rs.map(([n,t])=>`<dt>${esc(n)}</dt><dd>${!t?'<span style="color:#bbb">-</span>':k==='dev'?t.split(' · ').map(x=>`<span class="pill">${esc(x).replace(/\((D\+\d+)\)/,'</span><span class="pill dd2">$1')}</span>`).join(''):esc(t)}</dd>`).join('')+'</dl>';}
    S.appendChild(sec);
    const ta=attachMemo(sec,k);ta.value=memo(p,k);ta._sync();
    ta.addEventListener('input',()=>{p.memos=p.memos||{};const v=ta.value.trim();if(v)p.memos[k]=v;else delete p.memos[k];clearTimeout(ta._t);ta._t=setTimeout(persist,300)});
  });
}

/* ---------- post-it memo ---------- */
function attachMemo(sec,key){
  const w=document.createElement('div');w.className='secwrap';sec.replaceWith(w);w.appendChild(sec);
  const b=document.createElement('button');b.type='button';b.className='mbtn';b.textContent='📌 메모';sec.appendChild(b);
  const pi=document.createElement('div');pi.className='postit hide';
  pi.innerHTML='<div class="ph"><span>📌 메모</span><button type="button" class="px" title="메모 지우기">✕</button></div><textarea placeholder="여기에 메모..."></textarea>';
  w.appendChild(pi);
  const ta=pi.querySelector('textarea');
  ta._sync=()=>{const has=!!ta.value.trim();pi.classList.toggle('hide',!has);b.classList.toggle('has',has)};
  ta.addEventListener('input',()=>b.classList.toggle('has',!!ta.value.trim()));
  b.onclick=()=>{pi.classList.remove('hide');ta.focus()};
  pi.querySelector('.px').onclick=()=>{if(ta.value.trim()&&!confirm('이 메모를 지울까요?'))return;ta.value='';ta.dispatchEvent(new Event('input'));pi.classList.add('hide')};
  return ta;
}
$$('#vEditF .sec').forEach((sec,i)=>{const ta=attachMemo(sec,SECS[i][0]);ta.id='m_'+SECS[i][0]});
function fillMemos(p){SECS.forEach(([k])=>{const ta=$('#m_'+k);ta.value=memo(p,k);ta._sync()})}

/* ---------- actions ---------- */
function openView(id){cur=data.find(p=>p.id===id);if(!cur)return;renderView(cur);$('#vPath').textContent=fmt.head(cur);show('view')}
function openEdit(p,isNew){cur=p;fill(p);$('#bDel').classList.toggle('hide',!!isNew);prevView=isNew?'list':'view';$('#eTitle').textContent=isNew?'새 환자 등록':fmt.head(p)+' · 수정';show('edit');if(isNew)$('#f_bed').focus()}
$('#list').onclick=e=>{const c=e.target.closest('.pt');if(c)openView(c.dataset.id)};
$('#bAdd').onclick=$('#bAdd2').onclick=()=>openEdit(blank(),true);
$('#vEdit').onclick=()=>openEdit(cur,false);
const goBack=()=>{if(document.body.dataset.view==='edit'&&prevView==='view'&&data.includes(cur)){renderView(cur);show('view')}else show('list')};
$$('[data-go]').forEach(b=>b.onclick=goBack);
$('#tBack').onclick=goBack;
$('#bMenu').onclick=e=>{e.stopPropagation();$('#dd').classList.toggle('hide')};
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))$('#dd').classList.add('hide')});
$('#dd').addEventListener('click',e=>{if(e.target.closest('button'))$('#dd').classList.add('hide')});
$('#bSave').onclick=()=>{
  collect(cur);
  if(!cur.name&&!cur.bed){toast('베드나 이름 중 하나는 적어주세요');return}
  if(!data.includes(cur))data.push(cur);
  if(persist())toast('저장했어요');renderView(cur);$('#vPath').textContent=fmt.head(cur);show('view');
};
$('#bDel').onclick=()=>{if(!confirm(`${fmt.head(cur)} 환자를 삭제할까요?`))return;data=data.filter(p=>p!==cur);cur=null;persist();show('list');toast('삭제했어요')};
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('복사했어요')}
$('#vCopy').onclick=()=>copy(toText(cur));
$('#bCopyAll').onclick=()=>{if(!data.length)return toast('환자가 없어요');copy([...data].sort((a,b)=>bedKey(a.bed)[0]-bedKey(b.bed)[0]).map(toText).join('\n\n'))};
$('#q').oninput=renderList;
$('#bWipe').onclick=()=>{if(!data.length)return;if(!confirm('모든 환자 기록을 삭제할까요?\n(근무 끝나면 정리용)'))return;data=[];persist();renderList();toast('전체 삭제했어요')};
$('#bExport').onclick=()=>{
  const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='환자노트_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#bImport').onclick=()=>$('#fImport').click();
$('#fImport').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;
    const ids=new Set(data.map(p=>p.id));let n=0;
    arr.forEach(p=>{if(p&&p.id&&!ids.has(p.id)){data.push(Object.assign(blank(),p));n++}});
    persist();renderList();toast(`${n}명 불러왔어요`)}catch(err){toast('⚠️ 올바른 백업 파일이 아니에요')}
};
show('list');
})();
</script></body></html>
